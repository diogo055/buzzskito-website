<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Crane fly (mosquito hawk) and mosquito drawn to the same scale, showing the crane fly is about five times longer and has no biting mouthparts while the mosquito has a needle-like proboscis">
  <title>Crane fly (&#8220;mosquito hawk&#8221;) vs mosquito, drawn to the same scale</title>
  <desc>A crane fly body is 15 to 25 millimetres, roughly one inch, with a wingspan of 1.0 to 6.5 centimetres and very long fragile legs. A mosquito body is 3 to 6 millimetres, an eighth to a quarter of an inch. Both are shown on a shared millimetre and inch ruler. The crane fly has a soft snout and no piercing mouthparts, so it cannot bite. The mosquito has a needle-like proboscis, and the female uses it to take blood.</desc>
  <rect width="720" height="420" fill="#ffffff"/>

  <text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0f2942">Crane fly (&#8220;mosquito hawk&#8221;) vs mosquito &#8212; same scale</text>
  <text x="24" y="56" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5a6b7c">Neither a predator of mosquitoes nor a colossal mosquito. Both figures below are drawn on the same ruler.</text>

  <!-- ═══ SHARED-SCALE COMPARISON CARD ═══ -->
  <g transform="translate(24,72)">
    <rect x="0" y="0" width="672" height="230" rx="10" fill="#fafcfd" stroke="#dbe4ec"/>

    <!-- ── CRANE FLY ── scale 6 px per mm, body 22 mm = 132 px ── -->
    <text x="18" y="26" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0f2942">Crane fly &#183; family Tipulidae</text>
    <text x="18" y="45" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">Body 15&#8211;25 mm (about 1 in) &#183; wingspan 1.0&#8211;6.5 cm (0.4&#8211;2.6 in)</text>

    <g transform="translate(190,132)">
      <!-- wings: long, narrow, held out from the body -->
      <ellipse cx="-14" cy="-16" rx="62" ry="11" fill="#cfd9e0" opacity="0.5" transform="rotate(-14)"/>
      <ellipse cx="-14" cy="16" rx="62" ry="11" fill="#cfd9e0" opacity="0.5" transform="rotate(14)"/>
      <!-- very long fragile legs (the defining feature) -->
      <g stroke="#7d6a52" stroke-width="1.4" fill="none" stroke-linecap="round">
        <path d="M-4,8 q-34,44 -96,60 M12,9 q-20,50 -64,74 M28,8 q-4,52 -30,78"/>
        <path d="M-4,-8 q-34,-44 -96,-60 M12,-9 q-20,-50 -64,-74 M28,-8 q-4,-52 -30,-78"/>
      </g>
      <!-- abdomen: long and slender -->
      <ellipse cx="-42" cy="0" rx="52" ry="7.5" fill="#8a7355"/>
      <ellipse cx="-42" cy="-2.5" rx="46" ry="3" fill="#9c8464" opacity="0.7"/>
      <!-- thorax -->
      <ellipse cx="22" cy="0" rx="17" ry="10" fill="#6f5c44"/>
      <!-- head, small, with a soft snout and NO piercing proboscis -->
      <circle cx="45" cy="0" r="8" fill="#5c4c38"/>
      <circle cx="42" cy="-3" r="2.4" fill="#2b2621"/>
      <path d="M53,0 q7,0 9,1.5 q-9,2 -9,-1.5 z" fill="#8a7355"/>
      <!-- antennae -->
      <g stroke="#5c4c38" stroke-width="1.1" fill="none" stroke-linecap="round">
        <path d="M50,-5 q14,-8 22,-6 M50,5 q14,8 22,6"/>
      </g>
      <!-- callout to the snout -->
      <path d="M66,2 l30,26" stroke="#94a3b0" stroke-width="1" fill="none"/>
      <text x="98" y="34" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#15803d">Soft snout &#8212; cannot pierce skin</text>
    </g>

    <!-- ── MOSQUITO ── same 6 px per mm, body 5 mm = 30 px ── -->
    <text x="418" y="26" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" fill="#0f2942">Mosquito &#183; family Culicidae</text>
    <text x="418" y="45" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">Body 3&#8211;6 mm (about &#8539;&#8211;&#188; in) &#183; true size, same ruler</text>

    <g transform="translate(470,132)">
      <ellipse cx="-4" cy="-5" rx="15" ry="3.5" fill="#cfd9e0" opacity="0.55" transform="rotate(-12)"/>
      <ellipse cx="-4" cy="5" rx="15" ry="3.5" fill="#cfd9e0" opacity="0.55" transform="rotate(12)"/>
      <g stroke="#3f4a3a" stroke-width="0.9" fill="none" stroke-linecap="round">
        <path d="M-2,3 q-8,12 -18,15 M3,3 q-4,13 -11,17 M8,3 q1,13 -4,17"/>
        <path d="M-2,-3 q-8,-12 -18,-15 M3,-3 q-4,-13 -11,-17 M8,-3 q1,-13 -4,-17"/>
      </g>
      <ellipse cx="-9" cy="0" rx="12" ry="3.4" fill="#4a553f"/>
      <ellipse cx="6" cy="0" rx="5.5" ry="4.2" fill="#3c4634"/>
      <circle cx="13" cy="0" r="3.2" fill="#2b3226"/>
      <path d="M16,0 L27,0" stroke="#111827" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M27,0 l24,26" stroke="#94a3b0" stroke-width="1" fill="none"/>
      <text x="6" y="42" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#b91c1c">Needle proboscis &#8212; this one bites</text>
    </g>

    <!-- ── SHARED RULER: 0 to 40 mm at 6 px per mm ── -->
    <g transform="translate(190,196)">
      <line x1="-96" y1="0" x2="144" y2="0" stroke="#0f2942" stroke-width="1.4"/>
      <g stroke="#0f2942" stroke-width="1.2">
        <line x1="-96" y1="-5" x2="-96" y2="5"/>
        <line x1="-36" y1="-4" x2="-36" y2="4"/>
        <line x1="24" y1="-5" x2="24" y2="5"/>
        <line x1="84" y1="-4" x2="84" y2="4"/>
        <line x1="144" y1="-5" x2="144" y2="5"/>
      </g>
      <text x="-96" y="19" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#33566b">0</text>
      <text x="-36" y="19" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#33566b">10 mm</text>
      <text x="24" y="19" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#33566b">20 mm</text>
      <text x="84" y="19" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#33566b">30 mm</text>
      <text x="144" y="19" text-anchor="middle" font-family="system-ui,sans-serif" font-size="10.5" fill="#33566b">40 mm (1.6 in)</text>
    </g>
    <text x="418" y="210" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">Same ruler &#8212; the mosquito is roughly <tspan font-weight="700">4&#8211;8&#215; shorter</tspan>.</text>
  </g>

  <!-- ═══ BOTTOM STRIP: THE MYTH ═══ -->
  <g transform="translate(24,314)">
    <rect x="0" y="0" width="672" height="86" rx="10" fill="#f0fdf4" stroke="#86c9a4"/>
    <text x="16" y="24" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#166534">The &#8220;mosquito hawk&#8221; does not hunt mosquitoes &#8212; at any life stage</text>
    <text x="16" y="45" font-family="system-ui,sans-serif" font-size="11.5" fill="#14532d">Adult crane flies have reduced mouthparts and are anatomically incapable of killing or eating another insect; most do not feed at all in their short adult life.</text>
    <text x="16" y="63" font-family="system-ui,sans-serif" font-size="11.5" fill="#14532d">Crane fly larvae (&#8220;leatherjackets&#8221;) live in soil and eat roots and decaying matter. Mosquito larvae live in standing water. The two never meet.</text>
    <text x="16" y="80" font-family="system-ui,sans-serif" font-size="11.5" fill="#14532d">The insects that really do eat mosquitoes: dragonflies, damselflies, bats, mosquitofish and frogs.</text>
  </g>
</svg>
