<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 690" width="720" height="690" role="img" aria-label="Side views of four crickets drawn to one inch scale: a humpbacked, wingless camel cricket with very long antennae, a yellowish-brown house cricket with three dark head bands, a black field cricket, and a large Jerusalem cricket with a round bald head and black-ringed abdomen.">
  <title>Camel cricket vs house cricket vs field cricket vs Jerusalem cricket</title>
  <desc>Side views of four crickets drawn to one inch scale: a humpbacked, wingless camel cricket with very long antennae, a yellowish-brown house cricket with three dark head bands, a black field cricket, and a large Jerusalem cricket with a round bald head and black-ringed abdomen.</desc>
  <rect width="720" height="690" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f2942">Camel cricket vs house cricket vs field cricket vs Jerusalem cricket</text>
<text x="24" y="59" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#5a6b7c">Side views drawn to the same scale. Only house and field crickets chirp.</text>
