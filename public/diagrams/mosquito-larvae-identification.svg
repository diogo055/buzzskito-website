<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Diagram of mosquito larvae hanging head-down from the water surface, with anatomy labels and a comparison against midge and fly larvae">
  <title>What mosquito larvae look like in water</title>
  <desc>Mosquito larvae hang head-down just under the water surface, breathing through a siphon at the tail, and thrash in an S-shaped motion when disturbed. They are 3 to 12 millimetres long. Midge larvae are thin, red and wriggle in figure eights on the bottom; rat-tailed maggots are pale with a long breathing tube.</desc>
  <rect width="720" height="400" fill="#ffffff"/>

  <text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0f2942">Mosquito larvae &#8212; what you are looking at</text>
  <text x="24" y="56" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5a6b7c">If it hangs head-down from the surface and thrashes when your shadow crosses it, it is a mosquito.</text>

  <!-- water body -->
  <g transform="translate(24,84)">
    <rect x="0" y="0" width="404" height="230" rx="8" fill="#e8f2f8" stroke="#b6d4e4"/>
    <!-- surface line -->
    <line x1="0" y1="30" x2="404" y2="30" stroke="#5aa8cc" stroke-width="2.5"/>
    <text x="8" y="22" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#2b7ba3">water surface</text>

    <!-- larva 1 (labelled, large) -->
    <g transform="translate(120,30)">
      <!-- siphon touching surface -->
      <line x1="0" y1="0" x2="0" y2="16" stroke="#4a5a3a" stroke-width="3"/>
      <!-- segmented abdomen curving down -->
      <path d="M0,16 q6,26 -2,50 q-6,20 4,36" stroke="#6b7a4a" stroke-width="9" fill="none" stroke-linecap="round"/>
      <g fill="#55632f">
        <circle cx="1" cy="26" r="1.6"/><circle cx="2" cy="38" r="1.6"/>
        <circle cx="0" cy="50" r="1.6"/><circle cx="-1" cy="62" r="1.6"/>
        <circle cx="1" cy="74" r="1.6"/>
      </g>
      <!-- thorax (wider) -->
      <ellipse cx="3" cy="96" rx="8" ry="10" fill="#7a8a52"/>
      <!-- head with brushes -->
      <circle cx="3" cy="110" r="6.5" fill="#4a5530"/>
      <g stroke="#4a5530" stroke-width="1.4" fill="none">
        <path d="M-2,116 q-5,5 -8,4 M8,116 q5,5 8,4 M3,117 v6"/>
      </g>
    </g>
    <!-- labels for larva 1 -->
    <g font-family="system-ui,sans-serif" font-size="11.5" fill="#33566b">
      <line x1="128" y1="40" x2="196" y2="40" stroke="#8aa0b0" stroke-dasharray="3 3"/>
      <text x="200" y="44" font-weight="600">siphon &#8212; it breathes here</text>
      <line x1="128" y1="96" x2="196" y2="96" stroke="#8aa0b0" stroke-dasharray="3 3"/>
      <text x="200" y="100">segmented abdomen</text>
      <line x1="132" y1="140" x2="196" y2="140" stroke="#8aa0b0" stroke-dasharray="3 3"/>
      <text x="200" y="144">head hangs lowest</text>
      <line x1="200" y1="176" x2="200" y2="176" stroke="none"/>
      <text x="200" y="180" font-weight="600" fill="#b45309">3&#8211;12 mm long</text>
    </g>

    <!-- smaller larvae for context -->
    <g opacity="0.75">
      <g transform="translate(46,30)">
        <line x1="0" y1="0" x2="0" y2="10" stroke="#4a5a3a" stroke-width="2"/>
        <path d="M0,10 q5,18 -2,34 q-4,14 3,24" stroke="#6b7a4a" stroke-width="6" fill="none" stroke-linecap="round"/>
        <circle cx="1" cy="72" r="4.5" fill="#4a5530"/>
      </g>
      <g transform="translate(300,30)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#4a5a3a" stroke-width="2"/>
        <path d="M0,12 q-6,20 2,38 q5,14 -3,22" stroke="#6b7a4a" stroke-width="6.5" fill="none" stroke-linecap="round"/>
        <circle cx="-2" cy="76" r="5" fill="#4a5530"/>
      </g>
      <g transform="translate(356,30)">
        <line x1="0" y1="0" x2="0" y2="9" stroke="#4a5a3a" stroke-width="2"/>
        <path d="M0,9 q6,16 -1,30 q-3,12 2,20" stroke="#6b7a4a" stroke-width="5.5" fill="none" stroke-linecap="round"/>
        <circle cx="1" cy="64" r="4" fill="#4a5530"/>
      </g>
    </g>

    <!-- pupa (comma shaped) -->
    <g transform="translate(240,44)">
      <path d="M0,0 q14,4 12,20 q-2,14 -14,16 q10,-10 6,-20 q-3,-10 -4,-16 z" fill="#5f6b45"/>
      <circle cx="4" cy="8" r="7" fill="#4a5530"/>
      <text x="20" y="16" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">pupa &#8212; comma-shaped,</text>
      <text x="20" y="30" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">2&#8211;3 days from flying</text>
    </g>
  </g>

  <!-- NOT a mosquito -->
  <g transform="translate(452,84)">
    <text x="0" y="14" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#9b2c22">NOT mosquito larvae</text>

    <g transform="translate(0,46)">
      <path d="M0,0 q16,-10 32,0 q16,10 32,0 q16,-10 32,0" stroke="#c0392b" stroke-width="5" fill="none" stroke-linecap="round"/>
      <text x="0" y="24" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f2942">Midge (bloodworm)</text>
      <text x="0" y="40" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">bright red, thin, wriggles on</text>
      <text x="0" y="54" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">the bottom &#8212; does not bite</text>
    </g>

    <g transform="translate(0,132)">
      <ellipse cx="26" cy="4" rx="26" ry="9" fill="#cbb89a"/>
      <line x1="52" y1="4" x2="96" y2="0" stroke="#a89778" stroke-width="2.5"/>
      <text x="0" y="28" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f2942">Rat-tailed maggot</text>
      <text x="0" y="44" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">pale, fat, one very long tail</text>
      <text x="0" y="58" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">&#8212; a hoverfly, harmless</text>
    </g>

    <g transform="translate(0,214)">
      <rect x="0" y="-6" width="230" height="44" rx="8" fill="#f0f7f4" stroke="#9dcfba"/>
      <text x="12" y="14" font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#1e6b4f">The movement test</text>
      <text x="12" y="30" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">Mosquito larvae jerk in an S-shape.</text>
    </g>
  </g>

  <text x="24" y="338" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b7c">Any standing water held for more than a week can breed them &#8212; rain barrels, saucers, tarps, blocked eavestroughs, an unopened pool.</text>
  <text x="24" y="360" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b7c">Larvae become biting adults in roughly 7&#8211;10 days in Ontario summer temperatures.</text>
</svg>
