<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 530" width="720" height="530" role="img" aria-label="Four adult cockroaches drawn to one inch scale: the half-inch German cockroach with two dark stripes behind its head, the half-inch brown-banded cockroach with light bands across its wings, the 1.25 inch almost-black Oriental cockroach with short wings, and the 2 inch reddish-brown American cockroach with a pale edge behind its head.">
  <title>Types of cockroaches: size and markings compared</title>
  <desc>Four adult cockroaches drawn to one inch scale: the half-inch German cockroach with two dark stripes behind its head, the half-inch brown-banded cockroach with light bands across its wings, the 1.25 inch almost-black Oriental cockroach with short wings, and the 2 inch reddish-brown American cockroach with a pale edge behind its head.</desc>
