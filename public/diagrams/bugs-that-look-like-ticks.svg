<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Comparison of a blacklegged tick against the insects most often mistaken for it: spider beetle, clover mite, brown dog tick, bed bug and poppy seed">
  <title>Bugs that look like ticks — how to tell them apart</title>
  <desc>A blacklegged tick has eight legs, no antennae and a flat teardrop body. A spider beetle has six legs plus antennae and a round humped body. A clover mite has eight legs with a very long front pair and is bright red. A bed bug has six legs and a flat oval body. Each is drawn enlarged with its true size noted.</desc>
  <rect width="720" height="420" fill="#ffffff"/>

  <text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0f2942">Is it a tick? Three checks that settle it</text>
  <text x="24" y="56" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5a6b7c">Count the legs &#183; look for antennae &#183; check whether the body is flat or humped</text>

  <!-- header row -->
  <g font-family="system-ui,sans-serif" font-size="11.5" font-weight="700" fill="#5a6b7c">
    <text x="188" y="88">LEGS</text>
    <text x="268" y="88">ANTENNAE</text>
    <text x="378" y="88">BODY</text>
    <text x="484" y="88">COLOUR</text>
    <text x="594" y="88">TRUE SIZE</text>
  </g>
  <line x1="24" y1="96" x2="696" y2="96" stroke="#d6dee6"/>

  <!-- ── TICK (the reference) ── -->
  <g transform="translate(0,100)">
    <rect x="24" y="0" width="672" height="72" fill="#f0f7f4"/>
    <g transform="translate(88,36)">
      <g stroke="#3a2410" stroke-width="1.6" fill="none">
        <path d="M-13,-10 L-26,-18 M-14,-3 L-30,-6 M-14,4 L-30,8 M-13,11 L-26,20"/>
        <path d="M13,-10 L26,-18 M14,-3 L30,-6 M14,4 L30,8 M13,11 L26,20"/>
      </g>
      <ellipse cx="0" cy="0" rx="14" ry="18" fill="#8b2f10"/>
      <ellipse cx="0" cy="-11" rx="8" ry="7" fill="#2b1a0c"/>
      <path d="M0,-17 l-2,-5 h4 z" fill="#2b1a0c"/>
    </g>
    <text x="24" y="20" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#1e6b4f">TICK</text>
    <g font-family="system-ui,sans-serif" font-size="12" fill="#0f2942">
      <text x="188" y="42" font-weight="700">8</text>
      <text x="268" y="42" font-weight="700">none</text>
      <text x="378" y="42">flat teardrop</text>
      <text x="484" y="42">brown / red-brown</text>
      <text x="594" y="42">1&#8211;5 mm</text>
    </g>
  </g>

  <!-- ── SPIDER BEETLE ── -->
  <g transform="translate(0,176)">
    <g transform="translate(88,36)">
      <g stroke="#5a3a1c" stroke-width="1.5" fill="none">
        <path d="M-10,-6 L-24,-14 M-11,2 L-26,4 M-10,9 L-22,20"/>
        <path d="M10,-6 L24,-14 M11,2 L26,4 M10,9 L22,20"/>
        <path d="M-5,-15 L-16,-28 M5,-15 L16,-28" stroke-width="1.2"/>
      </g>
      <ellipse cx="0" cy="2" rx="14" ry="15" fill="#7a4a22"/>
      <ellipse cx="-4" cy="-3" rx="5" ry="6" fill="#a06a34" opacity="0.55"/>
      <circle cx="0" cy="-13" r="5.5" fill="#4a2c12"/>
    </g>
    <text x="24" y="24" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0f2942">Spider beetle</text>
    <text x="24" y="42" font-family="system-ui,sans-serif" font-size="11" fill="#8a6d4f">the #1 mix-up</text>
    <g font-family="system-ui,sans-serif" font-size="12" fill="#0f2942">
      <text x="188" y="42" font-weight="700" fill="#9b2c22">6</text>
      <text x="268" y="42" font-weight="700" fill="#9b2c22">yes, long</text>
      <text x="378" y="42">round, humped</text>
      <text x="484" y="42">shiny reddish-brown</text>
      <text x="594" y="42">1.5&#8211;3.5 mm</text>
    </g>
    <line x1="24" y1="72" x2="696" y2="72" stroke="#eef2f6"/>
  </g>

  <!-- ── CLOVER MITE ── -->
  <g transform="translate(0,252)">
    <g transform="translate(88,36)">
      <g stroke="#7a1f1f" stroke-width="1.5" fill="none">
        <path d="M-9,-5 L-34,-24" stroke-width="2"/>
        <path d="M9,-5 L34,-24" stroke-width="2"/>
        <path d="M-9,0 L-24,-2 M-9,6 L-22,12 M-8,11 L-19,22"/>
        <path d="M9,0 L24,-2 M9,6 L22,12 M8,11 L19,22"/>
      </g>
      <ellipse cx="0" cy="2" rx="12" ry="13" fill="#b52d2d"/>
      <ellipse cx="-3" cy="-2" rx="4" ry="5" fill="#d45a5a" opacity="0.5"/>
    </g>
    <text x="24" y="24" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0f2942">Clover mite</text>
    <text x="24" y="42" font-family="system-ui,sans-serif" font-size="11" fill="#8a6d4f">leaves a red smear</text>
    <g font-family="system-ui,sans-serif" font-size="12" fill="#0f2942">
      <text x="188" y="42" font-weight="700">8</text>
      <text x="268" y="42" font-weight="700">none</text>
      <text x="378" y="42">oval, front legs very long</text>
      <text x="484" y="42" font-weight="700" fill="#b52d2d">bright red</text>
      <text x="594" y="42">0.75 mm</text>
    </g>
    <line x1="24" y1="72" x2="696" y2="72" stroke="#eef2f6"/>
  </g>

  <!-- ── BED BUG ── -->
  <g transform="translate(0,328)">
    <g transform="translate(88,36)">
      <g stroke="#6b2f18" stroke-width="1.5" fill="none">
        <path d="M-17,-8 L-30,-14 M-18,0 L-33,0 M-17,8 L-30,14"/>
        <path d="M17,-8 L30,-14 M18,0 L33,0 M17,8 L30,14"/>
        <path d="M-5,-13 L-13,-22 M5,-13 L13,-22" stroke-width="1.2"/>
      </g>
      <ellipse cx="0" cy="0" rx="18" ry="14" fill="#8f4a24"/>
      <g stroke="#6b2f18" stroke-width="0.9" opacity="0.6">
        <path d="M-12,-6 h24 M-14,0 h28 M-12,6 h24"/>
      </g>
      <ellipse cx="0" cy="-12" rx="5" ry="4" fill="#5c2f14"/>
    </g>
    <text x="24" y="24" font-family="system-ui,sans-serif" font-size="12.5" font-weight="700" fill="#0f2942">Bed bug</text>
    <text x="24" y="42" font-family="system-ui,sans-serif" font-size="11" fill="#8a6d4f">found in beds, not on skin</text>
    <g font-family="system-ui,sans-serif" font-size="12" fill="#0f2942">
      <text x="188" y="42" font-weight="700" fill="#9b2c22">6</text>
      <text x="268" y="42" font-weight="700" fill="#9b2c22">yes, short</text>
      <text x="378" y="42">flat oval, ridged</text>
      <text x="484" y="42">tan to red-brown</text>
      <text x="594" y="42">1.5&#8211;5 mm</text>
    </g>
  </g>
</svg>
