<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 610" width="720" height="610" role="img" aria-label="Identification marks of three spiders: a female black widow seen from underneath with a red hourglass on a round black abdomen, a brown recluse with a dark violin mark and six eyes in three pairs, and a striped wolf spider with eight eyes, four small in a row, two large above them and two on top of the head.">
  <title>Spider identification: black widow, brown recluse and wolf spider</title>
  <desc>Identification marks of three spiders: a female black widow seen from underneath with a red hourglass on a round black abdomen, a brown recluse with a dark violin mark and six eyes in three pairs, and a striped wolf spider with eight eyes, four small in a row, two large above them and two on top of the head.</desc>
  <rect width="720" height="610" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f2942">Spider identification: black widow, brown recluse and wolf spider</text>
<text x="24" y="59" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#5a6b7c">The one mark to look for on each. Not drawn to scale: body length is printed under each spider.</text>
<line x1="244" y1="84" x2="244" y2="556" stroke="#eef2f6"/><line x1="476" y1="84" x2="476" y2="556" stroke="#eef2f6"/><path d="M119.3,163 L107,110.1 L88,94.4 M136.7,163 L149,110.1 L168,94.4 M119.3,163 L92.7,130.8 L60.8,136.3 M136.7,163 L163.3,130.8 L195.2,136.3 M119.3,163 L90.9,164.6 L57.4,204.6 M136.7,163 L165.1,164.6 L198.6,204.6 M119.3,163 L101,188.1 L76.6,252.2 M136.7,163 L155,188.1 L179.4,252.2 " stroke="#1b1b1f" stroke-width="3.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="128" cy="214.6" rx="39.2" ry="39.2" fill="#1b1b1f"/><ellipse cx="128" cy="163" rx="14.6" ry="19" fill="#1b1b1f"/><path d="M113,199.54 L143,199.54 L130.5,219.04 L143,238.54 L113,238.54 L125.5,219.04 Z" fill="#d81e1e"/><text x="128" y="326" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#0f2942">Black widow (female)</text><text x="128" y="345" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-style="italic" fill="#5a6b7c">seen from underneath</text><text x="128" y="364" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">body about 1/2 in (13 mm)</text><text x="128" y="394" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#b91c1c">Red hourglass</text><text x="128" y="413" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">on the underside of a round,</text><text x="128" y="431" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">shiny black abdomen</text><text x="128" y="456" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">The shape varies, and now</text><text x="128" y="473" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">and then it is missing.</text><path d="M347.5,173 L336.6,116.5 L315.5,94.4 M372.5,173 L383.4,116.5 L404.5,94.4 M347.5,173 L320.7,139.6 L285.1,141 M372.5,173 L399.3,139.6 L434.9,141 M347.5,173 L318.7,177.2 L281.3,217.1 M372.5,173 L401.3,177.2 L438.7,217.1 M347.5,173 L329.9,203.4 L302.7,270.3 M372.5,173 L390.1,203.4 L417.3,270.3 " stroke="#a8824f" stroke-width="3.1" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="360" cy="220.8" rx="21.8" ry="29.1" fill="#b08a5a"/><ellipse cx="360" cy="173" rx="20.8" ry="25" fill="#c9a36e"/><path d="M360,158 C372,158 373,174 365,178 L362.5,194 L357.5,194 L355,178 C347,174 348,158 360,158 Z" fill="#5c3a1a"/><circle cx="357.4" cy="154" r="1.7" fill="#1a1008"/><circle cx="362.6" cy="154" r="1.7" fill="#1a1008"/><circle cx="349" cy="159" r="1.7" fill="#1a1008"/><circle cx="352" cy="156" r="1.7" fill="#1a1008"/><circle cx="371" cy="159" r="1.7" fill="#1a1008"/><circle cx="368" cy="156" r="1.7" fill="#1a1008"/><text x="360" y="326" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#0f2942">Brown recluse</text><text x="360" y="345" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-style="italic" fill="#5a6b7c">seen from above</text><text x="360" y="364" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">body about 3/8 in, never over 1/2 in</text><text x="360" y="394" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#8a5a1e">Six eyes in three pairs</text><text x="360" y="413" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">plus a dark violin whose neck</text><text x="360" y="431" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">points back toward the abdomen</text><text x="360" y="456" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">Legs and abdomen one plain</text><text x="360" y="473" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">color: no bands, no stripes.</text><path d="M577.2,171.4 L571,118.5 L552,102.8 M606.8,171.4 L613,118.5 L632,102.8 M577.2,171.4 L556.7,139.2 L524.8,144.7 M606.8,171.4 L627.3,139.2 L659.2,144.7 M577.2,171.4 L554.9,173 L521.4,213 M606.8,171.4 L629.1,173 L662.6,213 M577.2,171.4 L565,196.5 L540.6,260.6 M606.8,171.4 L619,196.5 L643.4,260.6 " stroke="#6b5c48" stroke-width="6.7" fill="none" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="592" cy="223" rx="25.8" ry="30.8" fill="#7a6a55"/><ellipse cx="592" cy="171.4" rx="24.6" ry="27.4" fill="#8a7860"/><path d="M592,152 L592,194" stroke="#d8c8a8" stroke-width="7" stroke-linecap="round"/><path d="M592,204 L592,248" stroke="#3d3226" stroke-width="9" stroke-linecap="round" opacity="0.75"/><path d="M578,156 L576,190 M606,156 L608,190" stroke="#3d3226" stroke-width="6" stroke-linecap="round" opacity="0.7"/><text x="592" y="326" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="16.5" font-weight="700" text-anchor="middle" fill="#0f2942">Wolf spider</text><text x="592" y="345" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12.5" text-anchor="middle" font-style="italic" fill="#5a6b7c">seen from above</text><text x="592" y="364" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">body 1/4 to 1 in</text><text x="592" y="394" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" text-anchor="middle" fill="#5a4a32">Eight eyes, two of them big</text><text x="592" y="413" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">gray, brown, black or tan,</text><text x="592" y="431" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" text-anchor="middle" fill="#5a6b7c">often with dark stripes</text><text x="592" y="456" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">Mother carries her egg sac,</text><text x="592" y="473" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">then her young on her back.</text><rect x="24" y="486" width="208" height="84" rx="10" fill="#f5f8fb" stroke="#dbe4ec"/><text x="128" y="505" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f2942">The hourglass, close up</text><path d="M112,516 L144,516 L131,538 L144,560 L112,560 L125,538 Z" fill="#d81e1e"/><rect x="256" y="486" width="208" height="84" rx="10" fill="#f5f8fb" stroke="#dbe4ec"/><text x="360" y="505" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f2942">Recluse eyes: 6, in 3 pairs</text><path d="M298,568 Q360,478 422,568 Z" fill="#c9a36e" opacity="0.5"/><circle cx="354" cy="530" r="5" fill="#1a1008"/><circle cx="366" cy="530" r="5" fill="#1a1008"/><circle cx="323" cy="548" r="5" fill="#1a1008"/><circle cx="333" cy="540" r="5" fill="#1a1008"/><circle cx="397" cy="548" r="5" fill="#1a1008"/><circle cx="387" cy="540" r="5" fill="#1a1008"/><rect x="488" y="486" width="208" height="84" rx="10" fill="#f5f8fb" stroke="#dbe4ec"/><text x="592" y="505" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f2942">Wolf spider eyes: 4 + 2 + 2</text><path d="M528,568 Q592,456 656,568 Z" fill="#8a7860" opacity="0.45"/><circle cx="571" cy="559" r="3.6" fill="#1a1008"/><circle cx="585" cy="559" r="3.6" fill="#1a1008"/><circle cx="599" cy="559" r="3.6" fill="#1a1008"/><circle cx="613" cy="559" r="3.6" fill="#1a1008"/><circle cx="579" cy="542" r="8" fill="#1a1008"/><circle cx="576.5" cy="539.5" r="2" fill="#fff" opacity="0.7"/><circle cx="605" cy="542" r="8" fill="#1a1008"/><circle cx="602.5" cy="539.5" r="2" fill="#fff" opacity="0.7"/><circle cx="561" cy="526" r="5" fill="#1a1008"/><circle cx="623" cy="526" r="5" fill="#1a1008"/><line x1="24" y1="580" x2="696" y2="580" stroke="#e2e8f0"/><text x="24" y="598" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5" fill="#94a3b8">Sources: UC IPM, UC Riverside, Missouri Dept. of Conservation.</text><text x="696" y="598" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="11.5" text-anchor="end" fill="#94a3b8">Diagram: BuzzSkito · buzzskito.ca · CC BY 4.0</text>
</svg>
