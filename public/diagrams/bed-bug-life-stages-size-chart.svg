<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 570" width="720" height="570" role="img" aria-label="Bed bug life stages drawn to one millimetre scale: egg 1 mm, nymph stages one to five at 1.5, 2, 2.5, 3 and 4.5 mm, an unfed adult of 5 to 7 mm that is flat, oval and brown, and a just-fed adult that is swollen, longer and reddish-brown.">
  <title>Bed bug size chart: egg, five nymph stages and adult</title>
  <desc>Bed bug life stages drawn to one millimetre scale: egg 1 mm, nymph stages one to five at 1.5, 2, 2.5, 3 and 4.5 mm, an unfed adult of 5 to 7 mm that is flat, oval and brown, and a just-fed adult that is swollen, longer and reddish-brown.</desc>
  <rect width="720" height="570" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f2942">Bed bug size chart: egg, five nymph stages and adult</text>
<text x="24" y="59" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#5a6b7c">Every stage drawn to the same scale. A nymph must take a blood meal before each molt.</text>
