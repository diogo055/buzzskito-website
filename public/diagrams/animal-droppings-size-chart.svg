<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 700" width="720" height="700" role="img" aria-label="Animal droppings drawn to one inch scale: coyote scat 3 to 4 inches long and 1 inch thick, raccoon droppings 2 to 3 inches long and half an inch thick, Norway rat droppings three quarters to 1 inch, roof rat half an inch, deer pellets half to 1 inch, round rabbit pellets about three eighths of an inch, squirrel droppings a quarter to half an inch, and house mouse droppings an eighth to a quarter inch.">
  <title>Animal poop identification chart by size and shape</title>
  <desc>Animal droppings drawn to one inch scale: coyote scat 3 to 4 inches long and 1 inch thick, raccoon droppings 2 to 3 inches long and half an inch thick, Norway rat droppings three quarters to 1 inch, roof rat half an inch, deer pellets half to 1 inch, round rabbit pellets about three eighths of an inch, squirrel droppings a quarter to half an inch, and house mouse droppings an eighth to a quarter inch.</desc>
  <rect width="720" height="700" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f2942">Animal poop identification chart: what left it, by size and shape</text>
<text x="24" y="59" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#5a6b7c">Drawn to the same scale. Size comes first, then shape, then where you found it.</text>
