="#33475b">8; no antennae</text><text x="626" y="336" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">6, each with a claw</text><rect x="24" y="348" width="672" height="34" fill="#f5f8fb"/><text x="30" y="370" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e6b4f">Moves</text><text x="160" y="370" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#b45309">jumps</text><text x="318" y="370" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#b45309">crawls</text><text x="476" y="370" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#b45309">crawls, then attaches</text><text x="626" y="370" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#b45309">crawls; cannot jump</text><rect x="24" y="382" width="672" height="34" fill="#ffffff"/><text x="30" y="404" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e6b4f">Shape</text><text x="160" y="404" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">thin side to side</text><text x="318" y="404" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">flat and oval</text><text x="476" y="404" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">flat teardrop</text><text x="626" y="404" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">long and narrow</text><rect x="24" y="416" width="672" height="34" fill="#f5f8fb"/><text x="30" y="438" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#1e6b4f">Found</text><text x="160" y="438" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">pets, pet bedding</text><text x="318" y="438" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">mattress seams, bed frame</text><text x="476" y="438" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">on skin, after outdoors</text><text x="626" y="438" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#33475b">in hair, near the scalp</text><g transform="translate(40,495)"><line x1="0" y1="0" x2="300" y2="0" stroke="#0f2942" stroke-width="2"/><line x1="0" y1="-8" x2="0" y2="0" stroke="#0f2942" stroke-width="2"/><text x="0" y="-13" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6b7c">0</text><line x1="20" y1="-4" x2="20" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="40" y1="-4" x2="40" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="60" y1="-4" x2="60" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="80" y1="-4" x2="80" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="100" y1="-8" x2="100" y2="0" stroke="#0f2942" stroke-width="2"/><text x="100" y="-13" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="12" text-anchor="middle" fill="#5a6b7c">5 mm</text><line x1="120" y1="-4" x2="120" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="140" y1="-4" x2="140" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="160" y1="-4" x2="160" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="180" y1="-4" x2="180" y2="0" stroke="#0f2942" stroke-width="1"/><line x1="200" y1="-8" x2="200" y2="0" stroke="#0f2942" strok