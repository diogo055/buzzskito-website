<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" width="720" height="560" role="img" aria-label="A cat flea, an adult bed bug, an adult blacklegged tick and a head louse drawn to one millimetre scale, with a table comparing size, number of legs, how each moves, body shape and where each is found.">
