  <text x="24" y="412" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="9" fill="#8a9aa8">Species behaviour per CDC and the American Mosquito Control Association. Schematic curves &#8212; local timing varies with species mix, weather and habitat.</text>
</svg>
