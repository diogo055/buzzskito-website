<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420" role="img" aria-label="Twenty-four hour chart of mosquito biting activity by species group, showing the Culex dusk peak just after local sunset, the Aedes daytime plateau with a midday heat dip, the Anopheles overnight plateau, and biting falling away between about 2 and 4 a.m.">
  <title>Mosquito biting activity across 24 hours, by species group</title>
  <desc>Culex house mosquitoes are near zero through the day, climb steeply around local sunset, peak in the first one to two hours after sunset, stay high until roughly midnight, then fall away to a low between about 2 and 4 a.m., with a smaller rise at dawn. Aedes species including the Asian tiger mosquito bite through the day, rising at dawn, dipping in the hottest part of the afternoon, and peaking again in late afternoon before dropping off after dark. Anopheles are low all day and hold a broad plateau through the night from about 10 p.m. to 3 a.m. The clock is anchored to local sunrise and sunset, which shift with latitude and month.</desc>
  <rect width="720" height="420" fill="#ffffff"/>
  <text x="24" y="32" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0f2942">When mosquitoes bite across 24 hours &#8212; by species group</text>
  <text x="24" y="53" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="12.5" fill="#5a6b7c">Anchored to local sunrise and sunset, which shift with latitude and month. Relative biting pressure, not absolute counts.</text>
