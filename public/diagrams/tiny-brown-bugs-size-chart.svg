<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 600" width="720" height="600" role="img" aria-label="Eight tiny brown house bugs drawn to one millimetre scale: drugstore beetle, flour beetle, sawtoothed grain beetle, spider beetle, carpet beetle larva, German cockroach nymph, adult bed bug and cat flea, each with its size and where it is found.">
  <title>Tiny brown bugs in the house: size chart</title>
