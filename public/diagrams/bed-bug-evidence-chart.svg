<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-label="Chart of the physical evidence bed bugs leave behind: rust-coloured smears, dark faecal spots, shed skins, eggs and live bugs, each with true size">
  <title>Bed bug evidence — what the marks on a mattress actually mean</title>
  <desc>Bed bugs leave rust or red smears from crushed bugs, dark ink-like faecal spots 1 millimetre across that bleed into fabric, translucent shed skins matching each life stage, pearl-white eggs about 1 millimetre glued into seams, and live bugs up to 5 millimetres. Faecal spotting concentrated along a seam is the most reliable single sign.</desc>
  <rect width="720" height="400" fill="#ffffff"/>

  <text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0f2942">The five things bed bugs leave behind</text>
  <text x="24" y="56" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5a6b7c">Faecal spotting along a seam is the most reliable single sign. Bites alone prove nothing.</text>

  <!-- mattress corner as the setting -->
  <g transform="translate(24,80)">
    <rect x="0" y="0" width="316" height="212" rx="12" fill="#f4f1ea" stroke="#d8d0c0"/>
    <path d="M0,44 h316" stroke="#c9bfa9" stroke-width="3"/>
    <path d="M22,0 v212" stroke="#c9bfa9" stroke-width="3"/>
    <text x="34" y="30" font-family="system-ui,sans-serif" font-size="11.5" font-weight="600" fill="#8a7c62">piping / seam &#8212; check here first</text>

    <!-- faecal spots along the seam -->
    <g fill="#2b2018">
      <circle cx="22" cy="72" r="3"/><circle cx="22" cy="88" r="2.4"/><circle cx="21" cy="104" r="3.4"/>
      <circle cx="23" cy="124" r="2.6"/><circle cx="22" cy="142" r="3"/><circle cx="22" cy="166" r="2.2"/>
    </g>
    <!-- bleed halo -->
    <g fill="#4a3428" opacity="0.28">
      <circle cx="22" cy="72" r="6"/><circle cx="21" cy="104" r="6.6"/><circle cx="22" cy="142" r="6"/>
    </g>

    <!-- rust smear -->
    <path d="M120,150 q26,-10 52,4 q-24,12 -52,-4 z" fill="#9c4a3c" opacity="0.55"/>
    <text x="120" y="182" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a58">crushed-bug smear</text>

    <!-- live bug -->
    <g transform="translate(214,96)">
      <g stroke="#6b2f18" stroke-width="1.2" fill="none">
        <path d="M-14,-7 L-24,-12 M-15,0 L-27,0 M-14,7 L-24,12 M14,-7 L24,-12 M15,0 L27,0 M14,7 L24,12"/>
      </g>
      <ellipse cx="0" cy="0" rx="15" ry="11" fill="#8f4a24"/>
      <g stroke="#6b2f18" stroke-width="0.8" opacity="0.6"><path d="M-10,-5 h20 M-11,0 h22 M-10,5 h20"/></g>
      <ellipse cx="0" cy="-10" rx="4.5" ry="3.5" fill="#5c2f14"/>
    </g>
    <text x="196" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#8a6a58">live adult</text>
  </g>

  <!-- ═══ RIGHT: the evidence key with true sizes ═══ -->
  <g transform="translate(360,80)">
    <text x="0" y="14" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#0f2942">What each sign means</text>

    <!-- faecal spot -->
    <g transform="translate(0,32)">
      <circle cx="14" cy="10" r="5" fill="#2b2018"/>
      <circle cx="14" cy="10" r="9" fill="#4a3428" opacity="0.25"/>
      <text x="38" y="6" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f2942">Faecal spots &#8212; about 1 mm</text>
      <text x="38" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">Digested blood. Bleeds into fabric like ink,</text>
      <text x="38" y="36" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">smears rusty when wiped with a damp cloth.</text>
    </g>

    <!-- shed skin -->
    <g transform="translate(0,88)">
      <g transform="translate(14,10)">
        <ellipse cx="0" cy="0" rx="10" ry="7" fill="none" stroke="#c8a878" stroke-width="1.6"/>
        <path d="M-6,-4 q6,4 12,0" stroke="#c8a878" stroke-width="1" fill="none"/>
      </g>
      <text x="38" y="6" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f2942">Shed skins &#8212; 1.5 to 5 mm</text>
      <text x="38" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">Translucent, hollow, bug-shaped. Five sizes</text>
      <text x="38" y="36" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">means a breeding population, not a hitchhiker.</text>
    </g>

    <!-- eggs -->
    <g transform="translate(0,144)">
      <g fill="#f2ece0" stroke="#cfc4ae" stroke-width="1">
        <ellipse cx="8" cy="10" rx="4" ry="6"/><ellipse cx="18" cy="8" rx="4" ry="6"/><ellipse cx="27" cy="11" rx="4" ry="6"/>
      </g>
      <text x="46" y="6" font-family="system-ui,sans-serif" font-size="12" font-weight="600" fill="#0f2942">Eggs &#8212; about 1 mm</text>
      <text x="46" y="22" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">Pearl white, glued into seams in clusters.</text>
      <text x="46" y="36" font-family="system-ui,sans-serif" font-size="11" fill="#5a6b7c">Survive most sprays &#8212; why one treatment fails.</text>
    </g>

    <!-- what is NOT evidence -->
    <g transform="translate(0,204)">
      <rect x="0" y="-8" width="336" height="76" rx="9" fill="#fef3f2" stroke="#f0a9a2"/>
      <text x="14" y="12" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#9b2c22">What is NOT evidence</text>
      <text x="14" y="30" font-family="system-ui,sans-serif" font-size="11" fill="#6b3a33">Bites alone. Reactions vary so much that some people</text>
      <text x="14" y="45" font-family="system-ui,sans-serif" font-size="11" fill="#6b3a33">show nothing at all while a partner is covered. Confirm</text>
      <text x="14" y="60" font-family="system-ui,sans-serif" font-size="11" fill="#6b3a33">with spotting, skins or a live bug before treating.</text>
    </g>
  </g>

  <text x="24" y="316" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b7c">Search order that finds them fastest: mattress piping &#8594; box-spring underside &#8594; headboard back &#8594; bed-frame joints &#8594; skirting behind the bed.</text>
  <text x="24" y="338" font-family="system-ui,sans-serif" font-size="12" fill="#5a6b7c">Bed bugs stay within a few metres of where you sleep &#8212; sofas count if that is where someone sleeps.</text>
</svg>
