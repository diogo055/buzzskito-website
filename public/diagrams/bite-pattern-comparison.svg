<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440" role="img" aria-label="Diagram comparing the distribution patterns of mosquito, bed bug, flea, chigger, tick and no-see-um bites on the body">
  <title>Bite pattern comparison — what the arrangement tells you</title>
  <desc>Mosquito bites are random and isolated on exposed skin. Bed bug bites appear in lines or clusters of three on skin touching the mattress. Flea bites cluster around ankles and lower legs. Chigger bites gather where clothing is tight, at the sock line and waistband. A tick bite is usually a single attachment. No-see-um bites appear in dense patches on exposed skin.</desc>
  <rect width="720" height="440" fill="#ffffff"/>

  <text x="24" y="34" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="19" font-weight="700" fill="#0f2942">The pattern identifies the insect &#8212; not the mark itself</text>
  <text x="24" y="56" font-family="system-ui,-apple-system,Segoe UI,sans-serif" font-size="13" fill="#5a6b7c">Individual bites look alike on most skin. Where they sit, and how they group, is the reliable signal.</text>

  <!-- column helper: 6 panels, 3 across x 2 down -->
  <!-- ═══ MOSQUITO ═══ -->
  <g transform="translate(24,80)">
    <rect x="0" y="0" width="216" height="164" rx="10" fill="#fafcfd" stroke="#dbe4ec"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#0f2942">Mosquito</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">scattered, isolated</text>
    <!-- arm silhouette -->
    <rect x="20" y="58" width="176" height="52" rx="26" fill="#f3e2d6" stroke="#e0c7b4"/>
    <g fill="#c0392b">
      <circle cx="52" cy="76" r="5"/><circle cx="104" cy="92" r="5.5"/>
      <circle cx="150" cy="72" r="4.5"/><circle cx="176" cy="94" r="5"/>
    </g>
    <text x="14" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">Exposed skin only. Puffy within</text>
    <text x="14" y="148" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">minutes, gone in 1&#8211;3 days.</text>
  </g>

  <!-- ═══ BED BUG ═══ -->
  <g transform="translate(252,80)">
    <rect x="0" y="0" width="216" height="164" rx="10" fill="#fafcfd" stroke="#dbe4ec"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#0f2942">Bed bug</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">lines or clusters of three</text>
    <rect x="20" y="58" width="176" height="52" rx="26" fill="#f3e2d6" stroke="#e0c7b4"/>
    <g fill="#c0392b">
      <circle cx="48" cy="84" r="5"/><circle cx="70" cy="80" r="5"/><circle cx="92" cy="86" r="5"/>
      <circle cx="132" cy="76" r="5"/><circle cx="152" cy="82" r="5"/><circle cx="172" cy="78" r="5"/>
    </g>
    <text x="14" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">On skin that met the mattress.</text>
    <text x="14" y="148" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">Often called breakfast-lunch-dinner.</text>
  </g>

  <!-- ═══ FLEA ═══ -->
  <g transform="translate(480,80)">
    <rect x="0" y="0" width="216" height="164" rx="10" fill="#fafcfd" stroke="#dbe4ec"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#0f2942">Flea</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">ankles and lower legs</text>
    <!-- leg silhouette -->
    <path d="M96,58 v56 q0,10 -10,10 h-16 q-10,0 -10,-10 v-56 z" fill="#f3e2d6" stroke="#e0c7b4"/>
    <g fill="#c0392b">
      <circle cx="72" cy="98" r="4"/><circle cx="84" cy="104" r="4"/><circle cx="66" cy="108" r="4"/>
      <circle cx="80" cy="114" r="4"/><circle cx="70" cy="118" r="3.5"/><circle cx="88" cy="94" r="3.5"/>
    </g>
    <text x="118" y="98" font-family="system-ui,sans-serif" font-size="11" fill="#8a6d4f">tight cluster,</text>
    <text x="118" y="112" font-family="system-ui,sans-serif" font-size="11" fill="#8a6d4f">below the knee</text>
    <text x="14" y="140" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">Small red dot at the centre. Usually</text>
    <text x="14" y="154" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">means a pet is carrying them.</text>
  </g>

  <!-- ═══ CHIGGER ═══ -->
  <g transform="translate(24,256)">
    <rect x="0" y="0" width="216" height="164" rx="10" fill="#fafcfd" stroke="#dbe4ec"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#0f2942">Chigger</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">where clothing presses</text>
    <rect x="20" y="58" width="176" height="52" rx="26" fill="#f3e2d6" stroke="#e0c7b4"/>
    <!-- waistband/sock line -->
    <rect x="112" y="54" width="16" height="60" fill="#5a6b7c" opacity="0.3"/>
    <g fill="#c0392b">
      <circle cx="98" cy="76" r="4"/><circle cx="104" cy="88" r="4"/><circle cx="96" cy="98" r="4"/>
      <circle cx="134" cy="80" r="4"/><circle cx="140" cy="92" r="4"/><circle cx="132" cy="100" r="3.5"/>
    </g>
    <text x="14" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">Sock line, waistband, behind knees.</text>
    <text x="14" y="148" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">Intense itch starting hours later.</text>
  </g>

  <!-- ═══ TICK ═══ -->
  <g transform="translate(252,256)">
    <rect x="0" y="0" width="216" height="164" rx="10" fill="#fafcfd" stroke="#dbe4ec"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#0f2942">Tick</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">one bite, often still attached</text>
    <rect x="20" y="58" width="176" height="52" rx="26" fill="#f3e2d6" stroke="#e0c7b4"/>
    <g transform="translate(104,84)">
      <g stroke="#3a2410" stroke-width="1.2" fill="none">
        <path d="M-7,-5 L-14,-10 M-8,-1 L-16,-2 M-8,3 L-16,5 M-7,7 L-14,12"/>
        <path d="M7,-5 L14,-10 M8,-1 L16,-2 M8,3 L16,5 M7,7 L14,12"/>
      </g>
      <ellipse cx="0" cy="0" rx="8" ry="10" fill="#8b2f10"/>
    </g>
    <text x="14" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">A spreading ring days later needs</text>
    <text x="14" y="148" font-family="system-ui,sans-serif" font-size="11" fill="#9b2c22" font-weight="600">a doctor, not a pharmacy.</text>
  </g>

  <!-- ═══ NO-SEE-UM ═══ -->
  <g transform="translate(480,256)">
    <rect x="0" y="0" width="216" height="164" rx="10" fill="#fafcfd" stroke="#dbe4ec"/>
    <text x="14" y="26" font-family="system-ui,sans-serif" font-size="13.5" font-weight="700" fill="#0f2942">No-see-um</text>
    <text x="14" y="44" font-family="system-ui,sans-serif" font-size="11.5" fill="#5a6b7c">dense patch, exposed skin</text>
    <rect x="20" y="58" width="176" height="52" rx="26" fill="#f3e2d6" stroke="#e0c7b4"/>
    <g fill="#c0392b">
      <circle cx="60" cy="76" r="3"/><circle cx="70" cy="84" r="3"/><circle cx="62" cy="92" r="3"/>
      <circle cx="76" cy="94" r="3"/><circle cx="84" cy="78" r="3"/><circle cx="90" cy="88" r="3"/>
      <circle cx="70" cy="72" r="2.6"/><circle cx="98" cy="80" r="2.6"/><circle cx="80" cy="100" r="2.6"/>
      <circle cx="54" cy="86" r="2.6"/>
    </g>
    <text x="14" y="132" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">Burning pinprick at the time. Peaks</text>
    <text x="14" y="148" font-family="system-ui,sans-serif" font-size="11" fill="#33566b">at dawn and dusk near water.</text>
  </g>
</svg>
