<text x="186" y="340" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0f2942">Newly hatched</text><text x="186" y="358" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">3 mm (1/8 in)</text><text x="186" y="375" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">dark, no wings</text>
