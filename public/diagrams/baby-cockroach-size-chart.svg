<text x="452" y="340" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle" fill="#0f2942">Large nymph</text><text x="452" y="358" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">up to 14 mm (9/16 in)</text><text x="452" y="375" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13" text-anchor="middle" fill="#5a6b7c">still no wings</text>
