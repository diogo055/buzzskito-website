<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" width="720" height="500" role="img" aria-label="German cockroach life stages drawn to one millimetre scale: an 8 mm egg case holding 30 to 40 eggs, a newly hatched 3 mm nymph, a half-grown nymph, a large wingless nymph of up to 14 mm, and a winged 13 to 16 mm adult with two dark stripes behind the head.">
  <title>Baby cockroach size chart: German cockroach egg case, nymphs and adult</title>
  <desc>German cockroach life stages drawn to one millimetre scale: an 8 mm egg case holding 30 to 40 eggs, a newly hatched 3 mm nymph, a half-grown nymph, a large wingless nymph of up to 14 mm, and a winged 13 to 16 mm adult with two dark stripes behind the head.</desc>
  <rect width="720" height="500" fill="#ffffff"/>
<text x="24" y="36" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#0f2942">Baby cockroach size chart: German cockroach, egg case to adult</text>
<text x="24" y="59" font-family="system-ui,-apple-system,Segoe UI,Arial,sans-serif" font-size="13.5" fill="#5a6b7c">A baby cockroach is a nymph: a small, wingless roach. All drawn to the same scale.</text>
