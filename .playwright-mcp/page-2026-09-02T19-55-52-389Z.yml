          - paragraph [ref=f97e978]: "Our latest innovation in the fight against mosquitoes is engineered specifically for the avid outdoors person and traveler. Thermacell EX90 is easy to use and provides hours of scent-free, mess-free mosquito defense. Our largest area repellent zone available, the EX90 provides a 20-foot zone of advanced mosquito protection. Features: Extended Mosquito Protection | Provides up to 9 Hours per charge; Heat-Activated Technology | Lithium-Ion powered, max protection in 15 minutes. Effectively Repel without Spray | No DEET sprays or lotions on your skin. No smoke, flames or harsh odors like citronella. Advanced Repellent | EPA reviewed for safety, provides a 20-foot mosquito protection zone. 40 Hours of Repellent in box. Thermacell Guarantee | Extend warranty to 3 years registration, automatic 2-year warranty included. Includes: Repeller One 40-Hour scent-free refill USB charging Cable Specifications: Dimensions (L × W × H/D):4.5 in. × 4.5 in. × 9 in. Weight: 1 lb. Warranty: 2-year standard warranty. Extend to 3 years with registration."
