                  - paragraph [ref=f231e427]:
                    - text: If you can’t get your hands on our picaridin-based picks, or you’re looking for the absolute lowest toxicity from an EPA-approved repellent, we recommend
                    - link "Mimikai Mosquito & Tick Bug Spray" [ref=f231e428] [cursor=pointer]:
                      - /url: https://www.nytimes.com/wirecutter/out/link/80519/237547/4/252263/?merchant=Amazon
                    - text: . Made with a combination of oil of lemon eucalyptus and 2-Undecanone—a newly approved repellent chemical based on a compound found in the wild tomato plant—Mimikai’s Tick & Bug Spray ranks marginally better than picaridin or DEET on factors such as dermal toxicity, eye irritation and skin irritation. We think that, if used correctly, our other picks should not pose a problem, but it’s clear that Mimikai poses less of one. Mimikai offers decent repellency (8-hours for mosquitoes and 4-hours for ticks), but we still prefer the longer-lasting products, especially when it comes to ticks.
