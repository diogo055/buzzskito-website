              - generic [ref=f231e477]:
                - heading "The research" [level=2] [ref=f231e482]
                - generic [ref=f231e485]:
                  - tab "Why you should trust us" [selected] [ref=f231e486] [cursor=pointer]
                  - tabpanel [ref=f231e487]:
                    - list [ref=f231e488]:
                      - listitem [ref=f231e489]:
                        - text: While researching this guide, we spoke with Joe Conlon, then the technical adviser of the
                        - link "American Mosquito Control Association" [ref=f231e490] [cursor=pointer]:
                          - /url: https://www.mosquito.org/
                        - text: (AMCA) and
                        - link "Sonja Swiger" [ref=f231e491] [cursor=pointer]:
                          - /url: https://entomology.tamu.edu/people/swiger-sonja/
                        - text: ", an associate professor in Texas A&M University’s Department of Entomology. We interviewed Judi Anderson, director of the"
                        - link "DEET Education Program" [ref=f231e492] [cursor=pointer]:
                          - /url: https://www.repellentinfo.org/
                        - text: ", an organization"
                        - link "supported by the companies" [ref=f231e493] [cursor=pointer]:
                          - /url: https://www.repellentinfo.org/about
                        - text: that make and sell DEET-based products. We also talked to Travis Avery, sales and marketing director at
                        - link "Sawyer Products" [ref=f231e494] [cursor=pointer]:
                          - /url: https://sawyer.com/
                        - text: ", Chris Fuentes, founder and former CEO of"
                        - link "Ranger Ready" [ref=f231e495] [cursor=pointer]:
                          - /url: https://rangerready.com/
                        - text: ", and"
                        - link "Michelle Arnau" [ref=f231e496] [cursor=pointer]:
                          - /url: https://www.linkedin.com/in/michelle-arnau-748a182/
                        - text: and
                        - link "Stephanie Watson" [ref=f231e497] [cursor=pointer]:
                          - /url: https://www.linkedin.com/in/stephanie-watson-90458034/
                        - text: ", the founders of Mimikai."
                      - listitem [ref=f231e498]:
                        - text: We also spoke with the
                        - link "Environmental Protection Agency" [ref=f231e499] [cursor=pointer]:
                          - /url: https://www.epa.gov/
                        - text: to learn more about its
                        - link "extensive approval process" [ref=f231e500] [cursor=pointer]:
                          - /url: https://www.epa.gov/insect-repellents/regulation-skin-applied-repellents
                        - text: for repellent chemicals. In addition, we relied on the findings of the
                        - link "Centers for Disease Control and Prevention" [ref=f231e501] [cursor=pointer]:
                          - /url: https://www.cdc.gov/
                        - text: and the
                        - link "World Health Organization" [ref=f231e502] [cursor=pointer]:
                          - /url: https://www.who.int/
                        - text: regarding the safety and effectiveness of various repellents.
                      - listitem [ref=f231e503]:
                        - text: We also relied on the
                        - link "National Pesticide Information Center" [ref=f231e504] [cursor=pointer]:
                          - /url: http://npic.orst.edu/ingred/ptype/repel.html
                        - text: ", a joint effort by Oregon State University and the EPA. The NPIC is a treasure trove of fully referenced repellent information, with comprehensive directories for every chemical and extensive links out to relevant EPA documents and peer-reviewed studies."
                      - listitem [ref=f231e505]:
                        - text: The
                        - link "Environmental Working Group" [ref=f231e506] [cursor=pointer]:
                          - /url: https://www.ewg.org/research/ewgs-guide-bug-repellents
                        - text: ", a nonprofit research and advocacy organization focused on environmental and health issues, also offers detailed, well-supported research on repellent chemicals, which we reviewed."
                      - listitem [ref=f231e507]:
                        - text: Like all Wirecutter journalists, we review and test products with complete editorial independence. We’re never made aware of any
                        - link "business implications" [ref=f231e508] [cursor=pointer]:
                          - /url: https://www.nytimes.com/wirecutter/reviews/how-wirecutter-makes-money/
                        - text: of our editorial recommendations. Read more about our
                        - link "editorial standards" [ref=f231e509] [cursor=pointer]:
                          - /url: https://www.nytimes.com/wirecutter/about/
                        - text: .
                - generic [ref=f231e512]:
                  - tab "Who this is for" [selected] [ref=f231e513] [cursor=pointer]
                  - tabpanel [ref=f231e514]:
                    - paragraph [ref=f231e515]:
                      - text: Mosquitoes and ticks pose a much bigger threat than just being incredibly annoying. A single bite “can be a matter of life and death,” said Joe Conlon of the AMCA. “There are lethal diseases out there, or ones that ... cripple you for life if you’re not using the right type of repellent.” Anyone spending time outdoors should think seriously about using a bug spray (or
                      - link "a spatial repellent" [ref=f231e516] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/reviews/mosquito-control-gear/
                      - text: ) to ward off biting insects.
                    - paragraph [ref=f231e517]:
                      - text: According to
                      - link "this 2018 CDC report" [ref=f231e518] [cursor=pointer]:
                        - /url: https://www.cdc.gov/mmwr/volumes/67/wr/mm6717e1.htm?s_cid=mm6717e1_x
                      - text: ", tick-borne diseases—including Lyme disease, spotted fevers, babesiosis, anaplasmosis, and ehrlichiosis—more than doubled in the US between 2004 and 2016, and they’ve occurred in new, expanded risk areas. I live in New Hampshire, and in the past 15 years, I have been treated for Lyme five times. I was lucky to spot it by its telltale"
                      - link "bull’s-eye rash" [ref=f231e519] [cursor=pointer]:
                        - /url: https://www.cdc.gov/lyme/signs-symptoms/index.html
                      - text: (not everyone does). On two of those occasions, I had to undergo a four-week course of the antibiotic doxycycline, which is awful in its own right. I also have family members who have been deeply affected by Lyme. Seeing what this disease
                      - link "is capable of" [ref=f231e520] [cursor=pointer]:
                        - /url: https://www.cdc.gov/lyme/signs-symptoms/index.html
                      - text: is a sobering experience; I can’t stress enough how important it is to protect yourself against tick bites.
                    - paragraph [ref=f231e521]:
                      - text: The CDC also reports epidemics of the mosquito-transmitted West Nile virus in the US.
                      - link "This map of West Nile cases in 2025" [ref=f231e522] [cursor=pointer]:
                        - /url: https://www.cdc.gov/west-nile-virus/data-maps/current-year-data.html
                      - text: shows infections in 47 states. Because such findings rely on a person seeking care and the medical provider actually reporting the case, the prevalence of bug-borne disease is likely worse than even the CDC says.
                    - paragraph [ref=f231e523]: Even if you live in an area with a larger-scale mosquito-control program, repellents are still a good idea. Texas A&M entomologist Sonja Swiger told us that community-wide vector control “can still only control so much, so to get down to your personal space, you have to add to it.”
                    - complementary [ref=f231e524]:
                      - heading "To create a bug-free bubble outdoors" [level=4] [ref=f231e525]
                      - list [ref=f231e526]:
                        - listitem [ref=f231e527]:
                          - article [ref=f231e528]:
                            - link [ref=f231e530] [cursor=pointer]:
                              - /url: https://www.nytimes.com/wirecutter/reviews/mosquito-control-gear/
                              - img "The Best Mosquito Control Gear for Your Patio or Yard" [ref=f231e532]
                            - heading [level=3] [ref=f231e534]:
                              - link "The Best Mosquito Control Gear for Your Patio or Yard" [ref=f231e535] [cursor=pointer]:
                                - /url: https://www.nytimes.com/wirecutter/reviews/mosquito-control-gear/
                    - generic [ref=f231e538]:
                      - paragraph [ref=f231e539]: Advertisement
                      - link "SKIP ADVERTISEMENT" [ref=f231e540] [cursor=pointer]:
                        - /url: "#after-dfp-ad-chapter-mid-4"
                - generic [ref=f231e543]:
                  - tab "How we picked and tested" [selected] [ref=f231e544] [cursor=pointer]
                  - tabpanel [ref=f231e545]:
                    - figure "Some of the insect repellents we’ve tested over the years. Michael Murtaugh/NYT Wirecutter" [ref=f231e546]:
                      - img "A group of repellents we tested." [ref=f231e550]
                      - generic [ref=f231e551]:
                        - text: Some of the insect repellents we’ve tested over the years.
                        - generic [ref=f231e552]: Michael Murtaugh/NYT Wirecutter
                    - paragraph [ref=f231e553]:
                      - text: The heart of any bottle of bug spray is the repellent chemical, so we started there before we dug into specific products. To cut to the chase, our research led us to picaridin, a repellent chemical endorsed by the
                      - link "CDC" [ref=f231e554] [cursor=pointer]:
                        - /url: https://wwwnc.cdc.gov/travel/page/avoid-bug-bites
                      - text: and the
                      - link "WHO" [ref=f231e555] [cursor=pointer]:
                        - /url: https://www.who.int/publications/m/item/information-for-travellers-visiting-countries-with-zika-virus-transmission
                      - text: . Independent tests prove that a 20% concentration of picaridin can repel mosquitoes and ticks for up to 12 hours. But we began our search considering all options, using expert guidance to determine what mattered most when seeking a formula to recommend. Below is an overview of the factors we considered.
                    - paragraph [ref=f231e556]:
                      - strong [ref=f231e557]: "EPA approval:"
                      - text: This requirement left us with a short list of skin-applied repellents focusing on picaridin, DEET, IR3535, 2-Undecanone and oil of lemon eucalyptus, or OLE (as well as PMD, its synthetic form). To meet EPA approval, a chemical must undergo extensive testing and evaluation for efficacy, safety, and the potential for environmental hazards. “If it doesn’t have an EPA registration, then it hasn’t been proven,“ Texas A&M’s Swiger told us.
                    - complementary [ref=f231e558]:
                      - paragraph [ref=f231e559]: “Is garlic repellent? Yes, it is. Is it a good repellent? No, it isn’t.” —Joe Conlon, technical adviser of the American Mosquito Control Association
                    - paragraph [ref=f231e560]:
                      - text: Because they are classified as pesticides, the EPA approves for use not only all repellent chemicals but also every product that includes those chemicals. This approval extends all the way to the specific labeling on the bottle, including efficacy times, application procedures, and storage and handling. In fact, according to the
                      - link "EPA website" [ref=f231e561] [cursor=pointer]:
                        - /url: https://www.epa.gov/pesticide-labels/introduction-pesticide-labels
                      - text: ", this labeling is “legally enforceable … In other words, the label is the law.”"
                    - paragraph [ref=f231e562]:
                      - text: Store shelves are loaded with repellents that are not approved by the EPA. Most of these are based on essential oils, including cedar oil, lemongrass oil, peppermint oil, and citronella oil. The fact is,
                      - link "essential oils make terrible bug repellents" [ref=f231e563] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/blog/essential-oils-terrible-bug-repellents/
                      - text: . Conlon told us that although many of these formulas have some effectiveness, it lasts for a very limited time. “If you spread garlic all over your body, you’re going to get 20 minutes of repellency, then you’re going to have to do it again,” Conlon said. “Is garlic repellent? Yes, it is. Is it a good repellent? No, it isn’t.”
                    - paragraph [ref=f231e564]:
                      - strong [ref=f231e565]: "Safety:"
                      - text: Picaridin was created in the 1980s, so it hasn’t been studied as much as DEET, which has been around since the 1940s. But like DEET, picaridin does have a proven track record of safety. According to the
                      - link "NPIC" [ref=f231e566] [cursor=pointer]:
                        - /url: http://npic.orst.edu/factsheets/PicaridinGen.html#symptoms
                      - text: ", skin irritation due to picaridin is “very uncommon,” and the chemical “is considered practically nontoxic if inhaled.” Further, the"
                      - link "EPA" [ref=f231e567] [cursor=pointer]:
                        - /url: https://www.cdph.ca.gov/Programs/CID/DCDC/Pages/EPA-Registered-Repellent-Ingredients.aspx
                      - text: has approved the chemical for use in children as young as 2 months old. For pregnant women, the EWG recommends a picaridin concentration of 20% and a DEET concentration of no more than 20% to 30%. “What studies have been done have found no connection between picaridin use and any neurotoxicity, carcinogenicity, mutagenicity, or anything like that,” Conlon told us.
                    - paragraph [ref=f231e568]:
                      - strong [ref=f231e569]: "Effectiveness:"
                      - text: A 2018 review published in
                      - link "the Journal of Travel Medicine" [ref=f231e570] [cursor=pointer]:
                        - /url: https://academic.oup.com/jtm/article/25/suppl_1/S10/4990399
                      - text: analyzed 11 studies comparing DEET and picaridin, and concluded that “the studies showed little potential difference between DEET and picaridin applied at the same dosage, with some evidence pointing to a superior persistence for picaridin.” According to the EPA-approved labels, a repellent with 20% picaridin can provide protection for up to 12 hours, while one with 25% DEET provides up to 10 hours. The studies mentioned in the Journal of Travel Medicine analysis offered varying results, with the majority showing 20% picaridin effectiveness up to and beyond nine and 10 hours.
                    - paragraph [ref=f231e571]:
                      - text: We should also note that the percentage of an active ingredient doesn’t necessarily translate to increased efficacy. It appears that after a certain concentration, a maximum effectiveness is reached, and additional concentration results in longer protection time only. According to the
                      - link "CDC" [ref=f231e572] [cursor=pointer]:
                        - /url: https://wwwnc.cdc.gov/travel/yellowbook/2020/noninfectious-health-risks/mosquitoes-ticks-and-other-arthropods
                      - text: ", “DEET efficacy tends to plateau at a concentration of approximately 50%.” The CDC also recommends using a DEET concentration of at least 20% to ward off ticks, implying that lower concentrations have reduced effectiveness against such hardier insects."
                    - paragraph [ref=f231e573]:
                      - strong [ref=f231e574]: "Minimal drawbacks:"
                      - link "DEET (PDF)" [ref=f231e575] [cursor=pointer]:
                        - /url: https://www3.epa.gov/pesticides/chem_search/reg_actions/reregistration/fs_PC-080301_1-Apr-98.pdf
                      - text: is effective but tends to be oily and smelly. Judi Anderson, director of the
                      - link "DEET Education Program" [ref=f231e576] [cursor=pointer]:
                        - /url: http://www.deetonline.org/
                      - text: ", told us, “DEET-based products are not recommended for use directly on certain fabrics, such as rayon, spandex, acetate, or other synthetic fabrics,” adding that “it can affect the finish of many hard surfaces, such as plastic, vinyl, paint, or lacquer.”"
                      - link "Oil of lemon eucalyptus (PDF)" [ref=f231e577] [cursor=pointer]:
                        - /url: https://www3.epa.gov/pesticides/chem_search/reg_actions/registration/fs_PC-011550_01-Apr-00.pdf
                      - text: doesn’t last as long as DEET and picaridin, and the biggest drawback in our tests was the extremely strong odor.
                      - link "IR3535 (PDF)" [ref=f231e578] [cursor=pointer]:
                        - /url: https://www3.epa.gov/pesticides/chem_search/reg_actions/registration/fs_PC-113509_01-Jan-00.pdf
                      - text: ", like DEET, also affects plastics. And permethrin, an EPA-approved pesticide that is particularly useful against ticks, is meant to be used on clothing and gear—think a backpack or tent—but not directly on skin. High concentrations of permethrin, when wet, can be toxic to cats, but once it dries, there’s no issue. Picaridin has relatively few drawbacks, which is why it leads our recommendations, but over years of testing we’ve come to appreciate that any EPA-approved repellent can play an effective role on bug defense, even if there are flaws to be aware of."
                    - paragraph [ref=f231e579]:
                      - strong [ref=f231e580]: "A decent spray bottle:"
                      - text: A good repellent is wasted in a bad bottle. The best ones apply repellent in an even coat with limited overspray. Kids are squirmy, so getting repellent on them takes precision, as does applying spray to the neck and shoulder area. Locking caps are a plus, prohibiting accidental sprays and providing one more barrier for a curious child to overcome. We looked at both pump sprays and aerosols. Some manufacturers offer repellent lotions. We have more thoughts on these
                      - link "below" [ref=f231e581] [cursor=pointer]:
                        - /url: "#repellent-lotions-cons-and-a-couple-pros"
                      - text: .
                    - paragraph [ref=f231e582]:
                      - strong [ref=f231e583]: We did not test for efficacy
                      - text: of the individual repellents, for a few reasons. First, there are simply too many variables to consider to make any sweeping statements on repellency. The US alone has over 176 species of mosquitoes, and, as Conlon has written for the AMCA, “The process of a mosquito questing for a blood meal involves a complex, interconnected cascade of behaviors, each probably having its own cues, be they visual, thermal, or olfactory.” In other words, the way someone smells, what they’re wearing, how much they’re sweating, and weather conditions can all affect mosquito attraction.
                    - paragraph [ref=f231e584]:
                      - strong [ref=f231e585]: We did test for usability,
                      - text: looking at different competitors’ bottles and comparing design details that we noticed when applying (lots of) bug spray firsthand. Is the spray nice and even? Does the repellent bottle have any safety features? Is it likely to activate when stuffed into a backpack? Are there any overwhelming odors?
