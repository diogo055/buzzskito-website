                    - paragraph [ref=f231e643]:
                      - text: After testing over 25 spray repellents, we’ve concluded that
                      - link "Sawyer Products 20% Picaridin Insect Repellent" [ref=f231e644] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/31704/152384/4/89467/?merchant=Amazon
                      - text: is the best. It has a 20% picaridin formula, making it effective against mosquitoes and ticks for up to 12 hours. Compared with the other picaridin-based repellents we looked at, the Sawyer spray applies repellent the most evenly, with the least amount of overspray. We also like its double cap design. Formula, though, has not changed.
                    - paragraph [ref=f231e645]:
                      - strong [ref=f231e646]: Sawyer insect repellent has a 20% picaridin base.
                      - text: As we
                      - link "outlined above," [ref=f231e647] [cursor=pointer]:
                        - /url: "#how-we-picked-and-tested"
                      - text: this chemical has the most positives and the fewest negatives of any EPA-approved repellent.
                    - paragraph [ref=f231e648]:
                      - strong [ref=f231e649]: It sprays evenly.
                      - text: All 20% picaridin repellents should provide similar protection, but the Sawyer pump spray stands apart due to a couple of usability features. Compared with other pump sprays, the Sawyer offers the most even cloud of repellent. The majority of the others we tested were too wet, and some even spat out little puddles, leaving thick droplets on the skin. We also like their aerosol spray bottle, but know that those are much harder to control and result in a lot more overspray. They also make it difficult to spray areas near the face, like the shoulders.
                    - figure "Sawyer’s two-cap design ensures it won’t activate in a stuffed backpack. Doug Mahoney/NYT Wirecutter" [ref=f231e650]:
                      - link [ref=f231e651] [cursor=pointer]:
                        - /url: https://cdn.thewirecutter.com/wp-content/media/2026/04/IMG_1747-scaled.jpg
                        - img "Up close picture of Sawyer’s two-cap design" [ref=f231e656]
                      - generic [ref=f231e657]:
                        - text: Sawyer’s two-cap design ensures it won’t activate in a stuffed backpack.
                        - generic [ref=f231e658]: Doug Mahoney/NYT Wirecutter
                    - paragraph [ref=f231e659]:
                      - strong [ref=f231e660]: It’s easy to tell how much you have left (compared to an aerosol spray).
                      - text: Another benefit to a pump bottle is that if you just give the bottle a little shake you can get a good sense of how much repellent is left. This is much harder to do with an aerosol can. (That’s more like shaking a can of whipped cream.)
                    - paragraph [ref=f231e661]:
                      - strong [ref=f231e662]: Sawyer's picaridin has minimal odor (well, there’s a very slight odor if you put your nose right to your skin), and it’s not oily.
                      - text: Once it dries, there are really no “tells” that you’re covered in bug repellent, other than a very slight tackiness on the skin that seems to go away within an hour. If you still use a DEET-based repellent, this will likely be a very different experience for you.
                    - figure "The Sawyer repellent coats the skin evenly, with no spitting or puddling. This is an older version of their bottle, but the newer one has the same spray. Kyle Fitzgerald/NYT Wirecutter" [ref=f231e663]:
                      - generic [ref=f231e665]:
                        - text: The Sawyer repellent coats the skin evenly, with no spitting or puddling. This is an older version of their bottle, but the newer one has the same spray.
                        - generic [ref=f231e666]: Kyle Fitzgerald/NYT Wirecutter
                    - paragraph [ref=f231e667]:
                      - strong [ref=f231e668]: It has two caps, which is a big winner, especially if you have kids.
                      - text: Both caps click in tightly, and it’s really difficult to pull them straight off. We’re not saying they’re totally childproof, but the added difficulty might be enough to discourage a toddler’s curiosity (or buy you some time to confiscate the bottle). This second cap also guarantees that the repellent won’t accidentally be set off while stuffed in a backpack or beach bag. If you don’t want to deal with the second cap, it can be discarded.
                    - heading "Flaws but not dealbreakers" [level=3] [ref=f231e669]
                    - paragraph [ref=f231e670]: The only real downside to the Sawyer repellent is that, like all picaridin sprays, it has a slight off-smell to it when first applied. Once it dries, which takes only a couple of minutes, the odor dissipates to nearly nothing, so this is only a minor gripe, and it’s consistent across all the repellents we tested.
                    - paragraph [ref=f231e671]:
                      - text: As a pump spray, this repellent is sold in 3- and 4-ounce sizes. It is also available in a
                      - link "6-ounce aerosol" [ref=f231e672] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/38632/162190/4/115058/?merchant=Amazon
                      - text: (with a
                      - link "twin pack" [ref=f231e673] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/38633/162191/4/115059/?merchant=Amazon
                      - text: option), which offers a continuous spray. We found it harder to use than the pump spray, but it offers the same protection, if the pump spray is out of stock or if you simply prefer the aerosol format.
