                    - paragraph [ref=f231e908]:
                      - text: If you live in
                      - link "tick country" [ref=f231e909] [cursor=pointer]:
                        - /url: https://www.cdc.gov/ticks/about/where-ticks-live.html
                      - text: ", get"
                      - link "Sawyer Products Permethrin Fabric Treatment" [ref=f231e910] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/26876/152387/4/89468/?merchant=Amazon
                      - text: ", which contains 0.5% permethrin, an insecticide that’s effective at stopping ticks, those particularly nasty creatures that carry Lyme, Rocky Mountain spotted fever, and a host of other serious diseases. We looked at four different permethrin sprays and preferred Sawyer’s due to its slightly better bottles, options for wide or narrow spray, broad availability, and variety of sizes (but the others we tried have the same reported effectiveness)."
                    - paragraph [ref=f231e911]:
                      - strong [ref=f231e912]: Permethrin protects clothes.
                      - text: You don’t apply permethrin directly to your skin. Instead, this odorless spray is used to treat clothing and pieces of gear, like a tent or backpack. Once dried, it offers protection for up to six washings (or about six weeks).
                    - paragraph [ref=f231e913]:
                      - strong [ref=f231e914]: It combines well with other repellents.
                      - text: Permethrin is suitable for most fabrics and should be used alongside other repellents. You treat clothes and gear with permethrin in advance, then apply a picaridin or DEET repellent as you head, for example, into
                      - link "the Peruvian jungle" [ref=f231e915] [cursor=pointer]:
                        - /url: https://amazon.com/gp/customer-reviews/R2EZKEV1TTFPAY?tag=thewire06-20&linkCode=xm2&ascsubtag=YT86777
                      - text: .
                    - paragraph [ref=f231e916]:
                      - strong [ref=f231e917]: Same stuff, slightly better bottle.
                      - text: The trigger spray on the Sawyer’s pump bottle is very even and easy to control compared to other
                      - link "similarly capable permethrin formulas" [ref=f231e918] [cursor=pointer]:
                        - /url: "#the-competition"
                      - text: we tested. If you prefer, this repellent also comes in an aerosol can, which is great if you’re treating something large—like a tent—so you don’t wear out your index finger. The pump spray also comes in a
                      - link "24-ounce size" [ref=f231e919] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/7898/23220/4/89471/?merchant=Amazon
                      - text: for the biggest jobs.
                    - paragraph [ref=f231e920]:
                      - text: The differences among the permethrin options are less pronounced than with the other types of repellents we recommend. The need for a super-precise spray pattern is not as important here, because it gets sprayed on a large object instead of, say, your ankle, your wrist, or the back of your neck. The most important thing to look for by far is EPA approval and the presence of 0.5% permethrin; competitors such as
                      - link "Ranger Ready Permethrin 0.5% Clothing-Worn Repellent" [ref=f231e921] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/51532/182571/4/148281/?merchant=Amazon
                      - text: ","
                      - link "Ben’s Clothing and Gear Insect Repellent" [ref=f231e922] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/31706/152391/4/89472/?merchant=Amazon
                      - text: ", and"
                      - link "Coleman Gear and Clothing Insect Treatment" [ref=f231e923] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/31707/152392/4/89473/?merchant=Amazon
                      - text: are also fine options.
                    - figure "Once permethrin is fully applied to these hiking boots, they’ll repel ticks for roughly six weeks. Kyle Fitzgerald/NYT Wirecutter" [ref=f231e924]:
                      - generic [ref=f231e926]:
                        - text: Once permethrin is fully applied to these hiking boots, they’ll repel ticks for roughly six weeks.
                        - generic [ref=f231e927]: Kyle Fitzgerald/NYT Wirecutter
                    - heading "Flaws But Not Dealbreakers" [level=3] [ref=f231e928]
                    - paragraph [ref=f231e929]:
                      - strong [ref=f231e930]: Permethrin is not applied like a regular repellent.
                      - text: For it to be fully effective, you can’t just put a few squirts on your pants as you head out the door. Each item needs to be fully treated, and that means it needs a thick coat of spray. Sawyer recommends taking each item outside and coating it until the moisture causes the fabric to darken. At that point, the permethrin needs to dry fully before something is worn.
                    - paragraph [ref=f231e931]:
                      - strong [ref=f231e932]: Some people worry that because permethrin is an insecticide, it will harm them, but this isn’t the case.
                      - text: Permethrin kills ticks by interfering with how neurons fire in the bugs’ little brains, causing them to spasm and die. But how our neurons fire is slightly different; plus, we’re much larger and can metabolize permethrin before it reaches our nervous system (permethrin is
                      - link "over 2,250 times more toxic to ticks (PDF)" [ref=f231e933] [cursor=pointer]:
                        - /url: https://gillmass.org/files/Gill_BOH_2018_Permethrin_Fact_Sheet_TER.pdf
                      - text: than to humans) and a 140-pound person would have no adverse health effects even if exposed to 32 grams of permethrin in a day, and a bottle of clothing treatment has less than 1 gram of permethrin. (If you’re pregnant, know that animal studies have found no evidence that permethrin is harmful—but make sure to read the next paragraph.)
                    - paragraph [ref=f231e934]:
                      - strong [ref=f231e935]: Permethrin is toxic to cats.
                      - link "On its site" [ref=f231e936] [cursor=pointer]:
                        - /url: https://sawyer.com/maximize-effectiveness-permethrin-fabric-treatment/
                      - text: ", Sawyer Products states that cats should not be exposed to wet permethrin, but that there is no risk once it’s dried. An"
                      - link "article in NPR" [ref=f231e937] [cursor=pointer]:
                        - /url: https://www.npr.org/sections/health-shots/2018/07/11/627843581/if-you-spray-your-clothes-with-permethrin-be-careful-around-the-cat
                      - text: looked into the issue and found that the problems typically start with higher concentrations of the chemical, but we think it’s a smart idea to be very aware of your feline friends when you spray your items.
                    - complementary [ref=f231e938]:
                      - heading "Readers also like" [level=4] [ref=f231e939]
                      - list [ref=f231e940]:
                        - listitem [ref=f231e941]:
                          - article [ref=f231e942]:
