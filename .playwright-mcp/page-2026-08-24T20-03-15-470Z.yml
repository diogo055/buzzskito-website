                          - paragraph [ref=f231e766]: DEET formulas aren’t more effective than picaridin (they tend to smell bad and feel oily, too). Cutter Backwoods Dry, with its even aerosol spray and locking cap, is the best DEET repellent we’ve found.
                          - 'link "Buying options: $7 from Amazon , opens in a new tab" [ref=f231e770] [cursor=pointer]':
