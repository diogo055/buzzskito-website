                      - text: doesn’t have the long-lasting protection of the picaridin-based products, but, according to the EPA, it has a lower toxicity level. Like picaridin, it goes on with a slightly chemical smell that quickly dissipates, in this case, replaced by a light floral odor.
                    - paragraph [ref=f231e839]:
                      - strong [ref=f231e840]: The formula uses two active ingredients, one of which is newly approved.
                      - text: For its repellency, Mimikai relies on 2-Undecanone and oil of lemon eucalyptus. 2-Undecanone is a new active ingredient, based on a compound found in the wild tomato plant. Because of this dual-chemical formulation, the percentage of each active ingredient is relatively low, only 11% for OLE and 7.75% for 2-Undecanone.
                    - paragraph [ref=f231e841]:
                      - strong [ref=f231e842]: It has the lowest toxicity of any EPA-approved repellent.
                      - text: The EPA evaluates each bug repellent for toxicity across a series of categories (eye irritation, skin irritation, etc), assigning each product a classification on a scale of one to four. The product then receives a final classification based on the highest toxicity classification it has been assigned. Mimikai is the only repellent we’ve seen that achieves Category IV, the least toxic. This can be seen by the fact that the label of the repellent has
                      - link "no signal words" [ref=f231e843] [cursor=pointer]:
                        - /url: https://www.epa.gov/pesticide-labels/label-review-training-module-2-parts-label-page-2
                      - text: (remember, the label is an EPA-approved document), such as ‘caution,’ ‘warning,’ or ‘danger.’
                    - paragraph [ref=f231e844]: Picaridin products fall into category III (slightly toxic), because it attains that level in the categories of oral, dermal, and acute eye irritation. Picaridin products, if used properly, carry little risk, and Mimikai poses even less of one.
                    - paragraph [ref=f231e845]:
                      - strong [ref=f231e846]: It smells nice, but goes on a bit oily.
                      - text: Mimikai reminds us of picaridin in how it goes on. At first, there is a chemical smell, but that quickly fades to the background. But unlike most picaridin products, Mimikai is scented, so after a few moments, we were left with a light (and fairly pleasant) floral odor. Mimikai is also oily, so where picaridin leaves a dry forearm, Mimikai leaves a slightly shiny one.
