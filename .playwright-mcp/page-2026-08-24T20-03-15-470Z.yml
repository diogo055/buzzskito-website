                    - paragraph [ref=f231e773]:
                      - text: If you can’t find a picaridin-based repellent, if you have a reaction to it (which we’ve heard anecdotally can happen), or if you simply prefer to stick with the active ingredient you’ve always relied on, we think the DEET-based
                      - link "Cutter Backwoods Dry Insect Repellent" [ref=f231e774] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/10333/138906/4/89470/?merchant=Amazon
                      - text: is the best option.
                    - paragraph [ref=f231e775]:
                      - strong [ref=f231e776]: DEET works.
                      - text: There’s no question DEET repellents are effective—in decades of testing since the 1940s, DEET has become, in
                      - link "Conlon’s words" [ref=f231e777] [cursor=pointer]:
                        - /url: https://www.mosquito.org/page/FAQ#Which%20repellent%20works%20best?
                      - text: ", “the standard by which all other repellents are judged.” But DEET is not any more effective than picaridin, and our firsthand tests confirmed its well-known drawbacks."
                    - paragraph [ref=f231e778]:
                      - strong [ref=f231e779]: This is a less oily, less smelly DEET formula
                      - text: . Cutter’s dry formula means it’s not as oily as regular DEET spray. And although it has an odor, it’s not as strong a scent compared with that of other repellents that contain DEET.
                    - paragraph [ref=f231e780]:
                      - strong [ref=f231e781]: You get solid protection.
                      - text: Cutter is a 25% DEET formula, which the EPA-approved label says provides up to 10 hours of protection, but a study published in
                      - link "The New England Journal of Medicine" [ref=f231e782] [cursor=pointer]:
                        - /url: https://www.nejm.org/doi/full/10.1056/nejmoa011699
                      - text: concluded that a 23.8% DEET product had a mean protection time closer to five hours. The
                      - link "American Academy of Pediatrics" [ref=f231e783] [cursor=pointer]:
                        - /url: https://www.aap.org/en/patient-care/environmental-health/promoting-healthy-environments-for-children/insect-repellents/?srsltid=AfmBOorOALX2BslGG63QOZDmrhyG2WhGzbiFJTfzhel2wKUUZvcYuZLS
                      - text: states “When used on children, insect repellents should contain no more than 30% DEET,” so Cutter’s formula provides long-lasting protection while still meeting that threshold.
                    - paragraph [ref=f231e784]:
                      - strong [ref=f231e785]: It sprays relatively evenly, and its cap can lock.
                      - text: The Cutter is an aerosol spray. The reason we didn’t go with a pump spray here is that none of the dry DEET formulations come in pump-spray bottles. That said, this spray nozzle applied more evenly than others we tried, and a handy twisting lock on the cap helps prevent it from accidentally depressing and discharging in a bag or backpack.
                    - heading "Flaws But Not Dealbreakers" [level=3] [ref=f231e786]
                    - paragraph [ref=f231e787]:
                      - strong [ref=f231e788]: DEET ain’t perfect.
                      - text: Compared to picaridin sprays, DEET formulas are smellier and oilier, and can damage plastics and synthetic fabrics. (So be careful when using it around your camera, rain jacket, and laminated trail map.)
                    - paragraph [ref=f231e789]:
                      - strong [ref=f231e790]: You can spray too much, or not have enough.
                      - text: Aerosol cans in general tend to overspray, which makes it harder than our picaridin picks to apply in limited areas. The can’s heft and solid metal exterior can make it hard to tell how much repellent you have left as the bottle gets low.
