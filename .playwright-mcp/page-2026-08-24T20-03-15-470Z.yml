                - generic [ref=f231e957]:
                  - 'tab "Repellent lotions: Cons and a couple pros" [selected] [ref=f231e958] [cursor=pointer]'
                  - tabpanel [ref=f231e959]:
                    - figure "Repellent lotions are also available. They offer long-lasting protection but take about 20 minutes to be effective. Michael Murtaugh/NYT Wirecutter" [ref=f231e960]:
                      - img "Two bottles of lotian bog repellent from Sawyer and Proven." [ref=f231e964]
                      - generic [ref=f231e965]:
                        - text: Repellent lotions are also available. They offer long-lasting protection but take about 20 minutes to be effective.
                        - generic [ref=f231e966]: Michael Murtaugh/NYT Wirecutter
                    - paragraph [ref=f231e967]: Some companies, including Sawyer and Proven, sell repellent lotions with a 20% picaridin concentration. We tested both, and they do have advantages. But we don’t think repellent lotions are the best option for general use, although they may work in your specific circumstances.
                    - paragraph [ref=f231e968]: Repellent lotions have two major downsides. First, they can’t be applied to clothing, so they’re less versatile. There is no way to get them onto your shoes or boots for added tick protection. The same goes for a backpack or a tent. Second, Conlon told us that after application, lotions take about 20 minutes to start repelling bugs. Sprays, like those we recommend, are more immediately effective.
                    - paragraph [ref=f231e969]:
                      - text: The upside of a lotion is that its effectiveness lasts longer than that of a spray. According to the labeling on the Sawyer and Proven lotions, the repellency time bumps up to 14 hours, as opposed to the 12 hours for the spray versions. The lotion may also be easier to apply to difficult areas, like the forehead or the back of the neck, or on a particularly squirmy child. As with the spray bottles, Sawyer
                      - link "4-" [ref=f231e970] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/14203/40582/4/184414/?merchant=Amazon
                      - text: and
                      - link "32-ounce" [ref=f231e971] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/61607/201046/4/184415/?merchant=Amazon
                      - text: while Proven is available in both
                      - link "2-" [ref=f231e972] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/38636/162195/4/115062/?merchant=Amazon
                      - text: and
                      - link "6-ounce" [ref=f231e973] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/38637/162196/4/115063/?merchant=Amazon
                      - text: bottles.
                - generic [ref=f231e976]:
                  - 'tab "Other repellents worth considering: Similar stuff, different bottles" [selected] [ref=f231e977] [cursor=pointer]'
                  - tabpanel [ref=f231e978]:
                    - figure "Many repellents with a 20% picaridin formulation should be just as effective as our picks. Michael Murtaugh/NYT Wirecutter" [ref=f231e979]:
                      - img "A selection of the best 20 percent picaridin repellents, in a line." [ref=f231e983]
                      - generic [ref=f231e984]:
                        - text: Many repellents with a 20% picaridin formulation should be just as effective as our picks.
                        - generic [ref=f231e985]: Michael Murtaugh/NYT Wirecutter
                    - paragraph [ref=f231e986]:
                      - text: Any other repellent with 20% picaridin should offer the same protection against mosquitoes and ticks for a similar duration of time. We’ve tested other brands, and even though they have some drawbacks—mostly centered on the spray pattern—they’re all valid options. One example, a former runner-up in this guide, is
                      - link "Ranger Ready Picaridin 20% Tick + Insect Repellent" [ref=f231e987] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/51017/181356/4/256536/?merchant=Amazon
                      - text: . In years of research and testing, we’ve found it offers the same protection as Sawyer’s repellent, and is available in pump- and trigger-spray bottles in a variety of scents.
                    - paragraph [ref=f231e988]:
                      - link "Proven 12 Hour Mosquito + Tick Spray" [ref=f231e989] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/38160/161412/4/115051/?merchant=Amazon
                      - text: and
                      - link "Natrapel Tick & Insect Repellent" [ref=f231e990] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/31705/152390/4/89469/?merchant=Walmart
                      - text: are pump sprays that are wet and spitty at times. We like that the Proven repellent has a completely clear bottle, which makes it easy to see how much is left, and that. Natrapel’s bottle has a small viewing window along the side.
                    - paragraph [ref=f231e991]:
                      - link "Off Defense Insect Repellent 1 With Picaridin" [ref=f231e992] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/45079/171988/4/132201/?merchant=Amazon
                      - text: is available in both an aerosol can and a pump-spray bottle. It’s very similar to our Sawyer pick, but it doesn’t have the range of buying options or the second cap. Off also has a
                      - link "Clean Feel Aerosol Insect Repellent" [ref=f231e993] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/61602/201040/4/184408/?merchant=Amazon
                      - text: . 20% picaridin formula.
                    - paragraph [ref=f231e994]:
                      - link "Ben’s Tick Repellent Eco-Spray" [ref=f231e995] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/38159/172911/4/115053/?merchant=Amazon
                      - text: is marketed as a tick repellent, but the 20% picaridin formula is just as effective on mosquitoes. This one is available only in an aerosol can, which can spray upside-down, but produced a dense and focused spray that we found harder to control than the others.
                    - paragraph [ref=f231e996]:
                      - link "Earthkind Stay Away Mosquitoes Insect Repellent" [ref=f231e997] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/51020/181359/4/148218/?merchant=Amazon
                      - text: has the spittiest spray of the bottles we looked at, but it has 20% picaridin, so it’ll work against mosquitoes and ticks. Earthkind also sells a
                      - link "0.6-ounce travel size" [ref=f231e998] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/51558/182606/4/148282/?merchant=Amazon
                      - text: ", which is similarly spitty and pricey per-ounce, but makes a great grab-and-go option for a pocket or a purse."
                    - figure "Michael Murtaugh/NYT Wirecutter" [ref=f231e999]:
                      - img "The two red repellant bottles set against a pale blue background" [ref=f231e1003]
                    - paragraph [ref=f231e1006]:
                      - text: Formulas with 15% picaridin concentrations work too, but for shorter periods of time.
                      - link "Repel Tick Defense" [ref=f231e1007] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/46383/173869/4/134316/?merchant=Amazon
                      - text: each have a 15% picaridin concentration, versus our picks’ 20%. The repellency is the same, but it lasts for just 10 hours, as opposed to the 12 you’d get with a 20% formula.
                    - complementary [ref=f231e1008]:
                      - heading "Readers also like" [level=4] [ref=f231e1009]
                      - list [ref=f231e1010]:
                        - listitem [ref=f231e1011]:
                          - article [ref=f231e1012]:
                            - link [ref=f231e1014] [cursor=pointer]:
                              - /url: https://www.nytimes.com/wirecutter/blog/essential-oils-terrible-bug-repellents/
                              - img "Why Essential Oils Make Terrible Bug Repellents" [ref=f231e1016]
                            - heading [level=3] [ref=f231e1018]:
                              - link "Why Essential Oils Make Terrible Bug Repellents" [ref=f231e1019] [cursor=pointer]:
                                - /url: https://www.nytimes.com/wirecutter/blog/essential-oils-terrible-bug-repellents/
                    - generic [ref=f231e1022]:
                      - paragraph [ref=f231e1023]: Advertisement
                      - link "SKIP ADVERTISEMENT" [ref=f231e1024] [cursor=pointer]:
