                  - paragraph [ref=f231e392]:
                    - text: DEET formulas aren’t our first choice because they smell bad, feel oily, and can damage plastic and synthetic fabrics. There’s no question DEET is effective—decades of tests and studies have established it as the gold standard in bug repellents—but it’s
                    - link "no more effective than picaridin" [ref=f231e393] [cursor=pointer]:
                      - /url: https://academic.oup.com/jtm/article/25/suppl_1/S10/4990399
                    - text: . If this type of classic repellent is all you can find (or if you prefer it), the best version we’ve found is
                    - link "Cutter Backwoods Dry Insect Repellent" [ref=f231e394] [cursor=pointer]:
                      - /url: https://www.nytimes.com/wirecutter/out/link/10333/138906/4/89470/?merchant=Amazon
                    - text: . Its 25% DEET formula protects against mosquitoes for up to 10 hours, and it smells milder and feels less oily than other DEET repellents we tried. Its locking cap is a design feature many other aerosol sprays lack.
