                    - paragraph [ref=f231e854]:
                      - strong [ref=f231e855]: It doesn’t last as long as our other picks, especially against ticks.
                      - text: We think that 8-hours of protection against mosquitoes is adequate for most scenarios. But Mimikai has a much shorter duration when it comes to ticks. Four hours is still a respectable amount of protection, but it’s only a third of the 12-hours that a 20% picaridin repellent provides. In places (or lifestyles) where ticks are of primary concern, Mimikai will need to be reapplied every four hours, something that might become tedious (or forgotten) during longer outings. We really appreciate that picaridin offers one-shot, 12-hour protection with really no need to reapply, or even think about it for the remainder of the day. We’d recommend anyone relying on Mimikai in tick country to supplement the protection with permethrin sprayed on clothing, shoes, and gear.
                    - paragraph [ref=f231e856]:
                      - strong [ref=f231e857]: The product and company are brand new.
                      - text: This isn’t necessarily a flaw, just our general caution with any new and unproven product or company (in this case, both). While all indications are that Mimikai will be able to handle their growth, there is still no track record to rely on as far as customer service, inventory, shipping, etc.
