                - generic [ref=f231e1027]:
                  - tab "What to look forward to" [selected] [ref=f231e1028] [cursor=pointer]
                  - tabpanel "What to look forward to We’re continuing to look into the active ingredient nootkatone, which was approved by the EPA in 2020. There are no products available yet which use it, but we hope to soon have a sense of the timeline and what we might expect from the ingredient in terms of repellency." [ref=f231e1029]:
                    - paragraph [ref=f231e1030]:
                      - text: We’re continuing to look into the active ingredient
                      - link "nootkatone" [ref=f231e1031] [cursor=pointer]:
                        - /url: https://nootkashield.com
                      - text: ", which was"
                      - link "approved by the EPA" [ref=f231e1032] [cursor=pointer]:
                        - /url: https://www.epa.gov/pesticides/nootkatone-now-registered-epa
                      - text: in 2020. There are no products available yet which use it, but we hope to soon have a sense of the timeline and what we might expect from the ingredient in terms of repellency.
                - generic [ref=f231e1035]:
                  - tab "The competition" [selected] [ref=f231e1036] [cursor=pointer]
                  - tabpanel [ref=f231e1037]:
                    - paragraph [ref=f231e1038]:
                      - text: We tested the
                      - link "Pestly All-Natural Insect Repellent" [ref=f231e1039] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/70474/216831/4/216317/?merchant=Pestly
                      - text: . It is clearly the best essential oil repellent
                      - link "we’ve tried" [ref=f231e1040] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/blog/essential-oils-terrible-bug-repellents/
                      - text: . The company has figured out how to encapsulate the volatile oils so they don’t evaporate so quickly. They’ve also conducted a number of studies to the rigorous standards of the EPA that demonstrate a strong degree of effectiveness against mosquitoes. But it’s still not a product we recommend. We have more details
                      - link "here" [ref=f231e1041] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/reviews/pestly-all-natural-bug-spray-review/
                      - text: .
                    - paragraph [ref=f231e1042]:
                      - text: SC Johnson’s
                      - link "Stem for Mosquitoes" [ref=f231e1043] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/51021/181360/4/148216/?merchant=Amazon
                      - text: ", an essential-oil–based repellent that intrigued us due to the backing of SC Johnson, the makers of Off. Unfortunately, the spray is extremely spitty and, like other essential-oil repellents, doesn’t have the EPA’s extensive testing to back up its effectiveness."
                    - paragraph [ref=f231e1044]:
                      - text: We looked at Off’s
                      - link "Deep Woods Insect Repellent V" [ref=f231e1045] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/10329/152397/4/89478/?merchant=Walmart
                      - text: and
                      - link "Deep Woods Insect Repellent VIII (Dry)" [ref=f231e1046] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/10335/190265/4/89479/?merchant=The%20Home%20Depot
                      - text: ", and, for a DEET option, neither is as good as"
                      - link "Cutter Backwoods Dry" [ref=f231e1047] [cursor=pointer]:
                        - /url: "#also-great-cutter-backwoods-dry-insect-repellent"
                      - text: . Deep Woods Dry is the better of the two, but the spray is thick, and it puddled on our arms. The regular Deep Woods is oily and smells pretty bad.
                    - paragraph [ref=f231e1048]: Repel Insect Repellent Sportsmen Max Formula 40% DEET is another DEET formulation.
                    - paragraph [ref=f231e1049]:
                      - text: We tested a number of lemon eucalyptus (OLE) repellents, prior to Mimikai’s introduction, and found they have an extremely strong smell. Our candidates included
                      - link "Murphy’s Lemon Eucalyptus Bug Spray" [ref=f231e1050] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/61603/201041/4/184410/?merchant=Target
                      - text: and
                      - link "Cutter’s Lemon Eucalyptus Insect Repellent" [ref=f231e1051] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/61604/201042/4/184411/?merchant=Amazon
                      - text: . We gave one bottle a single squirt in a closed room, and we could still smell it an hour later. Outside, with the repellent sprayed on our arms, it became the kind of smell we could taste in our mouths and feel in our throats.
                    - paragraph [ref=f231e1052]:
                      - link "Coleman SkinSmart DEET-free Insect Repellent" [ref=f231e1053] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/31713/152399/4/89481/?merchant=Walmart
                      - text: and
                      - link "Zevo On Body Mosquito Repellent + Tick Repellent" [ref=f231e1054] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/61605/201061/4/184412/?merchant=Target
                      - text: rely on the active ingredient IR3535 and go on dry with a light, floral scent. As the
                      - link "EWG" [ref=f231e1055] [cursor=pointer]:
                        - /url: https://www.ewg.org/research/ewgs-guide-bug-repellents/repellent-chemicals
                      - text: notes, IR3535, like DEET, may damage plastics.
                    - paragraph [ref=f231e1056]:
                      - link "Bullfrog Mosquito Coast Bug Spray Insect Repellent + Sunscreen SPF 50" [ref=f231e1057] [cursor=pointer]:
                        - /url: https://www.nytimes.com/wirecutter/out/link/61606/201044/4/184413/?merchant=Amazon
                      - text: is another IR3535 repellent, but this one is paired with a sunscreen, which is not recommended because sunscreen and insect repellents should be applied at different rates.
