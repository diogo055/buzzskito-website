                    - heading "Flaws but not dealbreakers" [level=3] [ref=f231e735]
                    - paragraph [ref=f231e736]: "Grand Tongo shares the relatively minor downsides common to picaridin sprays: A slight odor, and perfumes you might not prefer. Although any of these formulas pay for themselves by avoiding the nuisance and risk of bug bites, we could note as a minor flaw that the price of Grand Tongo and Sawyer sprays tend to be higher per ounce than classic DEET formulas. Another minor inconvenience we could note about the handy 1-ounce size is that, unlike Sawyer’s secure dual lid bottle, this size lacks a lid lock. An accidental spray in a pocket or bag is possible, although it was not a problem we had in testing."
