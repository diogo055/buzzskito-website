            - heading [level=2] [ref=f6e705]:
              - strong [ref=f6e706]: What to Consider When Choosing a Mosquito Trap
            - paragraph [ref=f6e707]:
              - text: According to Kyle Boureston, founder of
              - link "MosGone" [ref=f6e708] [cursor=pointer]:
                - /url: https://mosgone.com/
              - text: ", a mosquito control company based in Austin, Texas, “Mosquito traps are the only truly effective way to control the mosquito population."
              - link "Repellents and insecticides" [ref=f6e709] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/best-mosquito-yard-spray/
              - text: will kill almost anything they come into contact with while being sprayed, such as pollinators like bees and butterflies, and generally lose their efficacy shortly after being sprayed.”
            - paragraph [ref=f6e710]:
              - text: When evaluating available bug traps for a
              - link "pest-free home" [ref=f6e711] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/diy-pest-free-home/
              - text: and yard, consider the following criteria.
            - heading [level=3] [ref=f6e712]:
              - strong [ref=f6e713]: Types of Mosquito Traps
            - paragraph [ref=f6e714]: Mosquitoes are drawn to the carbon dioxide that people and animals exhale and the body heat we produce. Mosquito traps use a variety of methods to mimic these outputs with the aim of attracting and capturing these pests.
            - heading [level=4] [ref=f6e715]:
              - strong [ref=f6e716]: Fan Suction and Glue Board
            - paragraph [ref=f6e717]:
              - text: Mosquitoes are weak fliers, and fan traps create suction that pulls them into their collection chambers. Many fan traps also have glue boards (cardboard with adhesive on one side), so that when a mosquito gets sucked into a fan trap’s collection chamber, it hits the glue board and sticks to it. Don’t take that to mean you can use
              - link "fly trap" [ref=f6e718] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/best-fly-trap/
              - text: paper for mosquitoes, however, as it’s not an effective mosquito lure.
            - heading [level=4] [ref=f6e719]:
              - strong [ref=f6e720]: Ultraviolet Light
            - paragraph [ref=f6e721]:
              - text: Many mosquito traps use compact fluorescent or LED ultraviolet (UV) lighting embedded in an electric grid (aka
              - link "bug zapper" [ref=f6e722] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/best-bug-zappers/
              - text: ). Unlike other types of insects, mosquitoes aren’t attracted to UV alone, and it adds little to the heat/carbon dioxide effects. For that reason, UV-light traps often perform better when paired with an intake fan or a bit of added chemical bait (octenol).
            - heading [level=4] [ref=f6e723]:
              - strong [ref=f6e724]: Propane
            - paragraph [ref=f6e725]: Propane traps burn fuel to produce heat and carbon dioxide, mimicking exhaled breath from warm-blooded hosts. When mosquitoes approach the plumes, fans draw them into a collection chamber.
            - heading [level=4] [ref=f6e726]:
              - strong [ref=f6e727]: Water
            - paragraph [ref=f6e728]:
              - text: While eliminating standing water means eliminating a breeding habitat for mosquitoes, using
              - link "Mosquito Bits" [ref=f6e729] [cursor=pointer]:
                - /url: https://www.amazon.com/dp/B0001AUF8G/?tag=best-mosquito-trap-20&asc_source=browser&asc_refurl=https%3A%2F%2Fwww.bobvila.com%2Freviews%2Fbest-mosquito-traps%2F&ascsubtag=0000BV0000506860O0390084420260824202416_8bYYx3JjgMtCxR%7E17876017%7E0%7E1rdscif%7Ey6xg7h
              - text: in birdbaths, landscape ponds, and other water features acts as a
              - link "natural larvicide" [ref=f6e730] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/how-to-get-rid-of-mosquitoes-naturally/
              - text: that’s safe for people, pets, frogs, fish, and other aquatic animals.
            - heading [level=3] [ref=f6e731]:
              - strong [ref=f6e732]: Longevity
            - paragraph [ref=f6e733]: Weather conditions notwithstanding, the longevity of a mosquito trap depends on the type of trap and the components of the trap. LED UV lights can last for approximately 3,000 hours, or 4 months of continuous use, while glue boards for indoor traps can last up to 30 days before becoming full.
            - paragraph [ref=f6e734]: The length of time a propane mosquito trap can run depends on the size of the propane cylinder. A small propane tank (the size that attaches to a gas grill) can run a propane mosquito trap around the clock for about 3 weeks. Every time you refill the propane tank, remember to replace chemical attractants, empty the collection chamber, and clean the vents.
            - heading [level=3] [ref=f6e735]:
              - strong [ref=f6e736]: Ease of Use
            - paragraph [ref=f6e737]:
              - text: Like most
              - link "mosquito repellents" [ref=f6e738] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/best-mosquito-repellent/
              - text: ", most mosquito traps are incredibly easy to use. Simply attach a glue board (if applicable), plug them in, and turn them on. Ongoing maintenance includes replacing the glue boards when full, cleaning the collection chamber and vents, and replacing the UV bulb if it burns out."
            - paragraph [ref=f6e739]: If you have a propane trap, cleaning may take a bit longer because these larger devices tend to attract more mosquitoes than their electric counterparts.
            - heading [level=3] [ref=f6e740]:
              - strong [ref=f6e741]: Placement and Coverage
            - paragraph [ref=f6e742]: Indoor traps are generally meant for kitchens, bedrooms, or living areas, and they’ll be most effective a few feet off the ground on a counter or table and away from windows and fans. Outdoor traps should be hung in shady spaces 3 to 6 feet off the ground and 20 to 40 feet away from gathering spaces.
            - paragraph [ref=f6e743]:
              - text: Indoor traps may cover 300 to 2,000 square feet per unit, while outdoor models handle ¼ to 1½ acres. For more comprehensive coverage, you’re better off using multiple traps than a single large one. Even adding a
              - link "DIY mosquito trap" [ref=f6e744] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/diy-mosquito-trap/
              - text: 5 to 10 feet away from a store-bought one can help.
            - heading [level=2] [ref=f6e745]:
              - strong [ref=f6e746]: FAQ
            - paragraph [ref=f6e747]:
              - text: If you’re still wondering
              - link "how to get rid of mosquitoes" [ref=f6e748] [cursor=pointer]:
                - /url: https://www.bobvila.com/articles/how-to-get-rid-of-mosquitoes/
              - text: ", the following answers to commonly asked questions can help."
