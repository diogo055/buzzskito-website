            - paragraph [ref=f6e344]: The Tysonir Electric Bug Zapper uses heat and ultraviolet light from its 15-watt Blu-ray bulb to attract mosquitoes and a variety of other bugs. Its 4,200V electric shock grid, which is surrounded by a protective ABS plastic housing, quickly kills bugs. This unit plugs into a standard 110V household power outlet. It’s rated for both indoor and outdoor use in all kinds of weather. Users can hang the lantern-style housing by the metal loop or set it on a solid surface. For a quick cleanup, users simply unscrew the threaded base.
            - paragraph [ref=f6e345]: Using this mosquito zapper is as easy as plug-and-go. It’s simple and effective but best used in a dark room or an unlit outdoor area. Although this trap did kill any insect that had the misfortune of being lured into its electric grid, we did have two cons. First, there is no power button. You have to plug and unplug the machine from the wall outlet. Second, the zapping sound is loud. For some people, this may be insurance that it’s working, but it startled us almost every time we heard the zap. Nonetheless, for the economical price and easy portability, the Tysonir Electric Bug Zapper is handy as a backup unit or as an extra bug zapper to take to the cabin or use in an RV.
