              - text: if they’re already fans of the brand.
            - paragraph [ref=f6e498]: With integrated UV-LED lights to lure flying insects into its electric mesh grid, this was one of the mosquito traps for yard use that was more effective against flies and gnats than mosquitoes (simply because mosquitoes aren’t particularly attracted to light alone). Still, setup was as simple as charging the battery, the timer (2, 4, or 6 hours) meant we didn’t have to remember to turn it off, and the integrated 3-level lantern made our nighttime cribbage sessions on the deck much easier. Just remember that, as a battery-operated tool, it’s not fully waterproof.
