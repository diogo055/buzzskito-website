            - paragraph [ref=f6e446]: The Katchy insect trap uses UV light to attract and trap mosquitoes indoors. When the trap is placed near the source of the insects (a trash bin, for example), its quiet fan draws the bugs into the capture basket and onto a sticky glue board. Run this unit day and night, and you should see fewer bugs in a couple of days. Both the light and fan are powered by a USB cable that plugs into a wall adapter or a portable USB power source. This electric mosquito trap for home use is also compatible with scent attractants.
            - paragraph [ref=f6e447]:
              - text: We loved how well this product captured annoying fungus gnats and fruit flies. We did not think we had issues with mosquitoes indoors until we ran this machine for a whole week. We checked the trap daily and were amazed by the number of bugs stuck to the glue paper, including several mosquitoes! We do think the trap is a bit spendy. It only comes with four glue boards, and its coverage area is 320 square feet.
