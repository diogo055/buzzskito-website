            - paragraph [ref=f6e790]: Mark Wolfe is a writer and product tester with a background in the nursery and landscaping industry. For more than 20 years, he mowed, edged, planted, pruned, cultivated, irrigated, and renovated beautiful landscapes. Now he tests and writes reviews about the latest outdoor power equipment, hand tools, lawn-care products, and other outdoor-living goods.
