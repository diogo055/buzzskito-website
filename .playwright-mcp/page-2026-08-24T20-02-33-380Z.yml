            - paragraph [ref=f6e496]:
              - text: Ryobi’s cordless outdoor mosquito trap brings 2,550 volts of zapping power to backyards, campgrounds, or tailgate lots up to 1½ acres—yet it delivers all that output in a highly portable 3.34-pound package complete with a carry handle. Because the unit runs off Ryobi’s 18-volt ONE+ battery lineup, users can swap the included battery into other compatible tools or purchase the
              - link "tool-only version" [ref=f6e497] [cursor=pointer]:
