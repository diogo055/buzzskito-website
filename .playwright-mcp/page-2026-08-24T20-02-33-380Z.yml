            - paragraph [ref=f6e284]: This fan trap from Stem earned our top award for its discreet and effective control of mosquitoes and other flying pests. Designed for indoor areas like kitchens, bedrooms, and living rooms, its UV light is subtle (visible mainly to bugs) compared to most UV models. Plus, its whisper-quiet adjustable fan is effective for pulling lightweight mosquitoes, gnats, and fruit flies onto the replaceable glue pad without any zapping noises or chemical sprays. The unit is easy to control via touchscreen buttons, has two fan speeds, four timers from 3 hours to 24/7, and a 6-foot cord.
            - paragraph [ref=f6e285]: Like any partial- or full-UV unit, the Stem flying insect trap did best in darker areas and at night, but overall collection (even indoors) was higher than with many other options thanks to the suction fan. Although the manufacturer doesn’t list the unit’s coverage area, this small mosquito trap did an excellent job across our open-plan kitchen, dining room, and living room. The only real downside we found is that twisting the base open to replace the glue trap seemed harder than it needed to be, though the individual unit we tested might just be particularly tight at that connection point.
