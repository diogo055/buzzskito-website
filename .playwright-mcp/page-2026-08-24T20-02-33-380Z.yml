            - paragraph [ref=f6e543]: The Gardner WS-95 offers a reliable and straightforward solution for capturing flying insects without emitting carbon dioxide (CO2) indoors. We appreciated this aspect, as we prefer not to use any type of mosquito CO2 trap indoors.
            - paragraph [ref=f6e544]: Setting up the mosquito trapper was effortless. We hung it on a wall, inserted the included catch board, and patiently awaited the results. However, after 24 hours, we found only one tiny dead gnat lying on the glue board, despite noticing multiple mosquitoes and flies hovering around the trap.
            - paragraph [ref=f6e545]: Perplexed, we realized that we had forgotten to peel off the protective paper that revealed the sticky side of the board. Once we rectified this user error, the trap started capturing a significantly higher number of flying insects. This trap operates without an annoying zapper. The intense UV light attracts nearby insects, and upon entering the open-weave top, they encounter the glue board and get trapped.
            - paragraph [ref=f6e546]:
              - text: Aside from its functionality, the Gardner sconce boasts an attractive design, and we installed it on a kitchen wall, where insects tend to gather. However, there are a couple of downsides to consider. First, there is no shut-off switch, requiring the trap to be plugged in to turn on and unplugged to turn off. Second, the trap comes with only one sticky board. Additional boards must be
              - link "purchased separately" [ref=f6e547] [cursor=pointer]:
                - /url: https://www.amazon.com/dp/B00D6YMOBA/?tag=best-mosquito-trap-20&asc_source=browser&asc_refurl=https%3A%2F%2Fwww.bobvila.com%2Freviews%2Fbest-mosquito-traps%2F&ascsubtag=0000BV0000506860O0390084420260824202416_8bYYx3JjgMtCxR%7E17876017%7E0%7E1rdscif%7E1u7wk5
              - text: . The manufacturer recommends changing the glue board monthly and replacing the UV light annually.
            - paragraph [ref=f6e548]: Overall, the Gardner WS-95 is a powerful and user-friendly trap for controlling flying insects indoors.
