            - paragraph [ref=f6e596]: Catching mosquitoes indoors doesn’t often involve particularly attractive appliances, but the retro look of the Buzbug rechargeable bug zapper changes that. With its dual-wave UV design, this mosquito zapper is engineered to increase its draw of flying insects by up to 30 percent, pulling them toward a 3800-volt people- and pet-safe grid to meet their demise. The rechargeable unit gets to full power in 4.5 hours via USB-C charging and runs up to 8.5 hours cord-free. It’s easy to hang or carry with the attached leather-like lanyard—just be careful to protect it from the weather if you use it outdoors since it’s not waterproof.
            - paragraph [ref=f6e597]: Like the other UV-only bug zappers for mosquitoes we tested, the Buzbug is more effective against pests like flies and gnats than mosquitoes. That said, it easily had the best aesthetic of all the mosquito traps we tried, almost reminding us of an old-fashioned TV with its screen turned to static after programming ended for the night. Plus, when we used it on our deck during good weather, it made a massive difference against no-see-ums and flies. If mosquitoes are your biggest issue, however, you might want to pair it with another lure that attracts them better than light alone.
