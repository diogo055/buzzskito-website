        - heading "Why does steam work so well on bed bugs?" [level=2] [ref=f259e183]
        - paragraph [ref=f259e184]:
          - text: "Because heat kills every bed bug life stage — including the eggs that survive almost everything else. Steam exits the boiler at 100°C or hotter, and university extension research shows adults and nymphs die within minutes above roughly 48–50°C and near-instantly above 60°C, while eggs die within about a minute once surfaces pass roughly 55°C. Direct contact with 100°C steam is effectively an instant kill for all of them. Steam is also the only genuinely instant option in the house:"
          - link "what kills bed bugs on contact, and what only looks like it does" [ref=f259e185] [cursor=pointer]:
            - /url: /blog/what-kills-bed-bugs-instantly-canada
          - text: ranks it against alcohol, foggers and hardware-store aerosols.
        - paragraph [ref=f259e186]:
          - text: That makes steam unique among consumer tools. PMRA domestic-class sprays available in Canada are contact killers with weak residual performance against bed bugs, and pyrethroid resistance is now widespread in Canadian bed bug populations — a problem we cover in detail in
          - link "do bed bug sprays actually work" [ref=f259e187] [cursor=pointer]:
            - /url: /blog/do-bed-bug-sprays-actually-work
          - text: . Heat has no resistance mechanism. A bed bug cannot evolve its way around protein denaturation, which is why professional heat treatment remains the gold-standard commercial service and why a good steamer is the closest do-it-yourself equivalent.
        - paragraph [ref=f259e188]: "There is also a compliance bonus that matters in Canada specifically: a steamer is a physical device, not a pest control product, so it needs no PMRA registration, no licence, and no re-entry interval. It is legal in every province, every apartment, and every home with kids, pets, or chemical sensitivities."
        - heading "Which bed bug steamer should you buy in Canada?" [level=2] [ref=f259e189]
        - paragraph [ref=f259e190]: "Three machines dominate the category on Amazon.ca, and the honest answer is that the right one depends on how much steaming time your infestation needs. Here is how they compare on the specs that actually matter for bed bug work:"
        - table [ref=f259e192]:
          - rowgroup [ref=f259e193]:
            - row [ref=f259e194]:
              - columnheader "Model" [ref=f259e195]
              - columnheader "Power / Tank" [ref=f259e196]
