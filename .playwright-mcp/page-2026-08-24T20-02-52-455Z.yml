            - text: at bay, but it also protects against other insects such as ticks, spiders and chiggers. The permethrin spray bonds to fabric fibers for up to six weeks or through six washings, and won’t stain or damage fabrics, plastics or outdoor gear. Plus, once it dries, it has no odor.
