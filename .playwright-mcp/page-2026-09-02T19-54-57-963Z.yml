        - generic [ref=f59e1007]:
          - heading "Product description" [level=2] [ref=f59e1010]
          - paragraph [ref=f59e1012]: The original wood-based wire snap trap, the Victor Wide Pedal Rat Trap, provides immediate rodent control and is safe for household or business use. For effective rat control, each rat trap comes with a wide, expanded professional trip pedal. The wide pedal of this rat trap is easily activated – both by rodent interest in food and through accidental contact as rats scamper across the floor – to ensure maximum trapping. Once a rodent triggers the pedal, the rat trap immediately springs closed to eliminate the pest on contact. The rat trap can then be easily disposed of for quick and clean removal. These traps require no chemicals or poisons, so they are an ideal rat control device for use around food, water, children and pets. The disposable rat trap is safe for use around food, water, children and pets. Victor Easy Set Rat Traps are perfect for use anywhere in your home or business. These rat traps should be placed where rodents travel, such as along walls at 2 to 3 foot intervals.
