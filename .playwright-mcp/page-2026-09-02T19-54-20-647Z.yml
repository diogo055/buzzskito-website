              - img "tin cat, live mouse trap, mice, mouse trap, victor, victor pest" [ref=f7e1173]
              - generic [ref=f7e1174]:
                - heading "Victor TIN CAT Mouse Trap with Window" [level=3] [ref=f7e1175]
                - paragraph [ref=f7e1176]: Use this Victor TIN CAT mouse trap with window to eliminate the mice in your home. Designed for humane catch and release of mice, it holds up to 30 rodents at once. The convenient clear window allows for easy viewing of trapped mice, and the lid opens for simple, offsite release.
            - generic [ref=f7e1179]:
              - img "live trap, mouse trap, mice, pests, victor" [ref=f7e1181]
              - generic [ref=f7e1182]:
                - heading "How to Use the TIN CAT" [level=3] [ref=f7e1183]
                - paragraph [ref=f7e1184]: This Victor Mouse Trap is just so simple to set up! Start by adding a bit of peanut butter inside the trap and then fasten the lid. Then place the trap or traps near where you see mice and wait. This larger trap can hold up to 30 mice before it needs to be emptied, really making it ideal for larger infestations.
            - generic [ref=f7e1187]:
              - img "victor live trap, mice, mouse, mouse trap, live trap" [ref=f7e1189]
              - generic [ref=f7e1190]:
                - heading "Tips for Trapping" [level=3] [ref=f7e1191]
                - paragraph [ref=f7e1192]: A common mistake people make is to use too few traps. The most mice are captured in the first night after the trap is placed; afterward, those that remain are more cautious. Using plenty of traps means you can end the infestation even faster! When you begin to stop seeing fresh droppings, that means the mice have been eliminated. One the traps are full, simply follow your local regulations regarding animal release and let them go far away from your home.
