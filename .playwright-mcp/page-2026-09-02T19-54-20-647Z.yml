                      - generic [ref=f7e2349]:
                        - paragraph [ref=f7e2350]: I bought this mouse trap because we saw a little mouse going in and out under our porch. I put a cheap mouse trap (lethal), and caught 2, but my wife was feeling bad, so I bought this one, after reading the reviews on amazon.com. It's a very well made design, where the mouse goes in one of the side ports, opening the passage. Once in, the passage closes, locking the mouse inside. I put some of peanut butter in it, left it outside and didn't catch anything the first few days, but then noticed a little critter moving in it on the 4th or 5th day. I brought it to the field, and upon opening it saw another mouse hiding in the one of the conduits. It says can catch up to 30 mice, but I have my doubts that they would all fit in there.
                        - paragraph
                        - paragraph [ref=f7e2351]: One poster on amazon.com stated the importance of verifying this trap daily, and I can not stress this point strong enough. You don't want to starve your little guests, so please make sure there's not one trapped in there.
