                      - paragraph [ref=f7e2211]: As others have said, this trap does not work and allows mice to escape. The ramp that they enter on and is supposed to close behind them stays down about 1/4” so the mice just pull it down and squeeze back out. I suspected it wasn’t working as there were never mice in it even though I see them in the garage and the trap was baited with an attractant which works very effectively in snap traps. So I tested it by baiting it with sunflower seeds, and not surprisingly the next day the seeds were shelled and eaten and the mice were gone. Complete waste of money and this company that is known for rodent control should be embarrassed of this poorly designed trap.
