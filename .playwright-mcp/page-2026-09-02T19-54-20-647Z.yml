                      - paragraph [ref=f7e2576]: Solo quiero compartir que soy muy feliz con esta trampa. Yo creo que cumple con la función de trampa humanitaria. Ya que no es como otras que hacen súper ruido y son súper malvadas. Esta me gustó la verdad yo no esperaba que atrapara nada. Me llego ayer así que solo la saqué del empaque y naaa más tarde pongo el cebo y la dejé olvidada pegada a la pared y hoy al despertar cual fue mi sorpresa? Ya estaba habitada por un ratón. Me siento más tranquila porque había tenido que usar de esas trampas feas de pegamento y se que era horrible para el ratón y para mi. Esta es una alternativa muy buena tanto para ellos como para uno. Saludos!
