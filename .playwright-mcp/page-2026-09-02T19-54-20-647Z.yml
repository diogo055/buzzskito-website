                        - paragraph [ref=f7e2396]: This item works fantastically! You just put a little bit of peanut butter in the centre of the trap, set them out in places where you've seen the voles or moles or mice or whatever it is you're trying to catch run, and just let them go to it.
                        - paragraph
                        - paragraph [ref=f7e2397]: When I was looking at this product, I saw I saw another version that had a plastic viewing window to the inside. At the time I thought, "why would I wanna see these dead holes inside my trap?". But it turns out that would be the better option. It allows you to be able to look in and see if there is anything in there. Specifically if there are any critters that are still alive, because it can be a bit of a surprise when you open the lid and they jump out at you. That hasn't happened to me yet, but I imagine it will at some point. So I would recommend getting the clear top ones to have a better indication of what you're in for when you open the lid.
