                  - listitem [ref=f7e2584]:
                    - generic [ref=f7e2587]:
                      - generic [ref=f7e2588]: S. Johnson
                      - generic [ref=f7e2595]: 5 out of 5 stars
                      - heading "Tin Cat Better Than Real Cat !" [level=5] [ref=f7e2598]
                      - generic [ref=f7e2599]: Reviewed in the United States on November 20, 2011
                      - generic [ref=f7e2600]:
                        - 'link "Size: 1 Units" [ref=f7e2601] [cursor=pointer]':
                          - /url: /portal/customer-reviews/B00004RAMU/ref=cm_cr_dp_d_rvw_fmt?_encoding=UTF8&formatType=current_format
                        - link "Verified Purchase" [ref=f7e2604] [cursor=pointer]:
                          - /url: /gp/help/customer/display.html/ref=cm_cr_dp_d_rvw_avp?ie=UTF8&nodeId=G8UYX7LALQC8V9KA
                      - generic [ref=f7e2607]:
                        - generic [ref=f7e2613]:
                          - paragraph [ref=f7e2614]: I live on a farm, and have a chicken coop where chicken feed is readily available to the chickens 24/7. Unfortunately, this means that chicken feed is also available to mice 24/7. Because the chickens live in an older barn, there is no way to block the entrance of mice. No matter what I do -- or how clean I keep the chicken coop -- large numbers of mice WILL migrate into the coop from the surrounding fields. Fortunately they roam the coop at night AFTER the hens go to sleep on their roosts, so at least the chickens and the mice almost never meet up with one another.
                          - paragraph
                          - paragraph [ref=f7e2615]: Our barn cat - and a few neighborhood strays - do their part to keep the mouse population down. But when you have open food on tap 24/7 in an old barn that is out in a rural field, there is only so much that barn cats can do.
                          - paragraph
                          - paragraph [ref=f7e2616]: So we finally bought our first Tin Cat about a month ago. That thing really WORKS!
                          - paragraph
                          - paragraph [ref=f7e2617]: We are drawing 15 to 25 mice into it every night, and we're beginning to see a significant drop in the amount of chicken feed we're putting out each day.
                          - paragraph
                          - paragraph [ref=f7e2618]: I notice that some here suggest trapping the mice and then releasing them LIVE. I suggest to you that those folks do not live on a working farm in a rural area. And they are not trying to raise a flock of chickens in a healthy and clean environment.
                          - paragraph
                          - paragraph [ref=f7e2619]: Let them continue to release their captive mice live -- but I do not intend do that. We have too many live mice already living in the fertile fields that surround the old barn. Where do you think the mice are coming from in the first place?
                          - paragraph
                          - paragraph [ref=f7e2620]: Instead, I kill the mice and then dispose of them.
                          - paragraph
                          - paragraph [ref=f7e2621]: I have an old 8 in. by 13 in. by 3 in. deep metal cake pan -- perfect size to place the Tin Cat in after I retrieve it from the barn in the morning. I fill the cake pan with water, and then place the mouse filled trap in that pan for about 10 minutes. Obviously I do not open the metal box before dropping it in the pan of water.
                          - paragraph
                          - paragraph [ref=f7e2622]: When I come back 10 minutes later, I pull the Tin Cat trap out of the water, drain it, carefully open the metal box up, and empty the now drowned mice into a plastic garbage bag. I wear disposable latex gloves as I do this, needless to say, and dispose of the dirty gloves in the same bag before I seal it up.
                          - paragraph
                          - paragraph [ref=f7e2623]: After cleaning and re-baiting, I put the Tin Cat back into the barn so that it is available after dark to catch another batch of mice.
                          - paragraph
                          - paragraph [ref=f7e2624]: The Tin Cat has worked so well that we are already seeing a significant drop in the amount of chicken feed that we're having to put out each day.
                          - paragraph
                          - paragraph [ref=f7e2625]: And it has worked so well that tonight, I just ordered two more of the Tin Cats from amazon.
                          - paragraph
                          - paragraph [ref=f7e2626]: The thing I appreciate most about these metal mouse traps - above and beyond the fact that the things just work really well -- is the fact that they are perfectly safe for use around my chickens. The chickens don't seem to pay attention to the little metal boxes at all. But if they were to, there is no way that they could open the box, or get access to the mice that might be trapped inside the box. The Tin Cat is safe around lively, playful chickens, barn cats, and just about any other farm animals or family pets.
                          - paragraph
                          - paragraph [ref=f7e2627]: I'd give the Tin Cat more stars, but amazon limits me to just 5.
