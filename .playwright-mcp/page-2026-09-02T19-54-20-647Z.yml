                        - generic [ref=f7e2452]:
                          - paragraph [ref=f7e2453]: "excellent moyen de les capturer sans leur faire de mal. Le meilleur score: 4 d'un coup. Bien sûr, relâchées dans la nature loin des habitations ensuite. On en a bien attrapé une quinzaine en quelques jours. Elles étaient devenues très effrontées et allaient directement dans la volière de mes oiseaux et commençaient à grimper le long des barreaux pour grignoter les graines en hauteur. Le plus simple a été de mettre le piège directement dans la volière....tout à veillant à faire place nette autour, pour qu'elles soient plus intéressées par le contenu du piège que par les graines éparses."
                          - paragraph [ref=f7e2454]: Pour augmenter l'efficacité, coincer un tout petit morceau de gâteau juste au bout de la trappe d'accès et parsemer de sucre ou céréales la trappe d'accès (par les petits trous du haut). Ce qui fait qu'elles avancent dans la trappe sans se rendre compte qu'elles se font coincer.
                          - paragraph [ref=f7e2455]: Certaines sont très malignes.... il y en a une qui a réussi à ressortir, je ne sais pas trop comment, une autre s'était cachée sous la trappe d'accès, ce qui fait que j'ai cru que la boîte était vide et quand j'ai ouvert pour vérifier quand même, elle a bondi dans le jardin...
                          - paragraph [ref=f7e2456]: Il m'en reste encore une à attraper, si c'est l'une de celles qui a déjà expérimenté le piège, cela va être plus difficile. Je renouvelle l'appât tous les jours pour qu'il soit frais (gâteau, céréales, chocolat, etc...).
                          - paragraph [ref=f7e2457]: En conclusion, c'est très propre et il n'y a pas de mise à mort. Sûrement du stress pour elles, mais dès que je vois qu'il y en a une, je ne tarde pas pour la relâcher.
