                      - paragraph [ref=f7e2501]: Dopo aver provato le trappole a gabbietta classiche, che non hanno funzionato, con questa mi sono trovata benissimo. Ho già catturato e liberato vivi 5 topini. E' importante posizionare la trappola con le due aperture (una per lato) vicine al muro, in un punto che sia sulla loro traiettoria. Dentro ho messo un biscotto doppio farcito di cioccolata. Ci si accorge della cattura perchè il topo a tratti corre freneticamente avanti e indietro andando a sbattere sulle due bascule agli ingressi, quindi si sente tac tac tac, come un metronomo. Ma comunque è possibile vedere dentro dalle fessure che si vedono in foto, senza dover aprire la trappola. Comodo anche da "eliminare", si porta la scatola fuori senza rischio di venire a contatto col topo, io la appoggio per terra, apro il coperchio, e lui se ne va tranquillamente nella direzione opposta a me.
